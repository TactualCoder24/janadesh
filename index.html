<style>
/* Layout: white workspace. Home view: hero (headline + live 2024 chamber), how-it-works, scenarios, state grid. App view: header with pickers; control rail left; right column = result, map, charts, history. One column on phones with a pinned seat bar. */
:root{
  --bg:#FFFFFF; --panel:#FFFFFF; --sunk:#F2F3F5; --tint:#F6F7F8; --ink:#141414; --muted:#5D6068; --line:#E2E3E6;
  --violet:#4A2577; --violet-soft:#EEE8F5; --evm:#E6E8EA; --evm-edge:#C9CDD2; --evmblue:#1F4FA8; --lamp:#E2231A; --warn:#9A5800; --warn-soft:#FFF5E3; --good:#16794A; --bad:#B4372B;
  --display:"Anek Latin","Anek Devanagari","Segoe UI",system-ui,sans-serif; --body:"Hind","Segoe UI",system-ui,sans-serif;
  --r:12px; color-scheme:light;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{background:var(--bg);color:var(--ink)}
body{font-family:var(--body);font-size:15px;line-height:1.5;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0 32px}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--violet);outline-offset:2px}
.num{font-variant-numeric:tabular-nums}
h1,h2,h3{font-family:var(--display);margin:0;text-wrap:balance}
.wrapw{max-width:1440px;margin:0 auto}

.top{display:flex;flex-wrap:wrap;align-items:center;gap:12px 20px;padding-block:16px 14px;border-bottom:1px solid var(--line);margin-bottom:14px}
.brand{display:flex;align-items:center;gap:12px;margin-right:auto;cursor:pointer;background:none;border:0;padding:0;text-align:left}
.mark{width:38px;height:38px;flex:none;display:block}
.brand h1{font-size:27px;font-weight:800;font-stretch:110%;line-height:1}
.brand p{margin:2px 0 0;color:var(--muted);font-size:13px}
.pick{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.seg{display:inline-flex;border:1px solid var(--ink);border-radius:6px;overflow:hidden;flex-wrap:wrap}
.seg button{border:0;background:var(--panel);padding:5px 12px;cursor:pointer;color:var(--ink);font-weight:500}
.seg button + button{border-left:1px solid var(--ink)}
.seg button[aria-pressed="true"]{background:var(--ink);color:#fff}
select,.inp{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:6px 10px;max-width:100%}
.btn{border:1px solid var(--evm-edge);background:var(--panel);border-radius:5px;padding:6px 12px;cursor:pointer;font-weight:500;text-decoration:none;color:var(--ink);display:inline-flex;align-items:center;gap:6px}
.btn:hover{border-color:var(--violet);color:var(--violet)}
.btn.primary{background:var(--evmblue);border-color:var(--evmblue);color:#fff}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn.primary:hover{color:#fff;filter:brightness(1.08)}
.btn.small{padding:3px 10px;font-size:13px}
.btn.big{padding:12px 20px;font-size:17px;border-radius:10px}
.notice{border-left:4px solid var(--warn);padding:2px 0 2px 12px;font-size:13.5px;display:flex;gap:8px;align-items:baseline;margin-bottom:18px;color:var(--muted)}
.notice b{color:var(--warn);white-space:nowrap}

/* home */
.hero{display:grid;grid-template-columns:minmax(0,1.05fr) minmax(0,1fr);gap:28px;align-items:center;padding-block:26px 22px}
@media (max-width:900px){.hero{grid-template-columns:minmax(0,1fr)}}
.hero h2{font-size:clamp(38px,6vw,68px);font-weight:800;font-stretch:112%;line-height:1;letter-spacing:-.01em}
.hero .sub{font-size:18px;color:var(--muted);max-width:52ch;margin:14px 0 22px}
.hero .ctas{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.hero .ctasub{color:var(--muted);font-size:14px;margin-top:10px}
.hsearch{margin-top:22px;max-width:560px}
.hsearch h4{margin:0;font-family:var(--display);font-size:18px}
.hsearch p{margin:2px 0 8px}
.hsearch input{width:100%;cursor:text;font-size:16px;padding:10px 12px}
.future{margin-top:22px;padding:14px;background:var(--evm);border:1px solid var(--evm-edge);border-radius:12px;max-width:560px}
.future h4{margin:0 0 8px;font-family:var(--display);font-size:18px}
.futrow{display:flex;flex-wrap:wrap;gap:10px;align-items:flex-end}
.futrow label{display:flex;flex-direction:column;gap:3px;font-size:12.5px;color:var(--muted);min-width:0}
.futrow select{min-width:120px}
.future .small{margin:8px 0 0}
.live{border-top:3px solid var(--ink);padding:12px 0 0}
.live p{margin:0 0 4px;font-weight:600;font-family:var(--display);font-size:16px}
.live svg{width:100%;height:auto;display:block}
.livelegend{display:flex;flex-wrap:wrap;gap:4px 14px;font-size:13.5px}
.livelegend span{display:inline-flex;align-items:center;gap:6px}
.sec{padding-block:20px;border-top:3px solid var(--ink);margin-top:10px}
.sec > h3{font-size:24px;font-weight:700;margin-bottom:4px}
.sec > .lede{color:var(--muted);margin:0 0 14px}
.steps{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:18px;margin-top:12px}
@media (max-width:760px){.steps{grid-template-columns:minmax(0,1fr)}}
.steps div{display:grid;grid-template-columns:36px minmax(0,1fr);gap:4px 12px}
.steps b{grid-row:1 / 3;font-family:var(--display);font-size:38px;font-weight:800;line-height:1;color:var(--evm-edge)}
.steps h4{margin:4px 0 0;font-family:var(--display);font-size:18px}
.steps p{margin:0;color:var(--muted)}
.scns{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:12px;margin-top:12px}
.scn{border:1px solid var(--evm-edge);border-radius:4px;padding:14px;background:var(--panel);text-align:left;cursor:pointer;font-size:15.5px;font-weight:500;line-height:1.35;display:flex;gap:10px;align-items:flex-start}
.scn:hover{border-color:var(--violet)}
.scn i{width:10px;align-self:stretch;border-radius:5px;flex:none}
.calgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(290px,1fr));gap:12px;margin-top:10px}
.calc{display:flex;gap:10px;border:1px solid var(--evm-edge);border-radius:4px;padding:12px;background:var(--panel);min-width:0}
.calc > i{width:8px;border-radius:4px;flex:none}
.calc .calt{font-family:var(--display);font-size:17px}
.calc .calst{margin:2px 0 4px}
.calc.open{border-color:var(--good)}
.calc.sched{border-color:var(--violet)}
.calhero{display:flex;flex-wrap:wrap;gap:12px 24px;align-items:center;justify-content:space-between;border-top:3px solid var(--ink);padding:14px 0;margin-top:6px}
.calhero h3{font-size:24px;margin:2px 0}
.calbig{font-family:var(--display);font-size:34px;font-weight:800;margin:0;color:var(--violet)}
.prhow{margin:0 0 8px;padding-left:20px;color:var(--muted)}
.predbox{margin-top:14px}
.predhemi{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:10px;margin:6px 0}
.predstat{display:flex;flex-wrap:wrap;gap:8px 28px;margin:6px 0 4px}
.predstat div{display:flex;flex-direction:column}
.predstat b{font-family:var(--display);font-size:26px;font-weight:800;line-height:1.1}
.predstat span{font-size:13px;color:var(--muted)}
.chip{display:inline-flex;align-items:center;gap:4px;border:1px solid var(--line);border-radius:14px;padding:2px 10px;font-size:13px;margin:2px 2px 2px 0}
.lvstep{display:inline-flex;align-items:center;gap:4px}
.lvstep input{width:70px;text-align:right}
.lvreplay{display:inline-flex;align-items:center;gap:8px;flex-wrap:wrap}
.gmbar{display:flex;justify-content:space-between;color:var(--muted);font-size:14px;margin-bottom:4px}
.gmprogress{height:6px;background:var(--sunk);border-radius:3px;overflow:hidden;margin:0 0 14px}
.gmprogress i{display:block;height:100%;background:var(--violet)}
.gmq{font-size:22px;margin:6px 0 12px}
.gmvis{margin-bottom:6px}
.gmopts{display:grid;gap:8px}
.gmopt{display:flex;gap:12px;align-items:center;text-align:left;border:1px solid var(--evm-edge);background:var(--panel);border-radius:6px;padding:10px 12px;font-size:16px;cursor:pointer;color:var(--ink)}
.gmopt:hover:not(:disabled){border-color:var(--violet)}
.gmopt:disabled{cursor:default}
.gmk{width:26px;height:26px;border-radius:13px;background:var(--sunk);display:inline-flex;align-items:center;justify-content:center;font-weight:700;font-size:13px;flex:none}
.gmopt.right{border-color:var(--good);background:#E8F4EC}
.gmopt.wrong{border-color:var(--bad);background:#FBECEA}
.gmfb{margin:12px 0 8px}
.gmfb.ok b{color:var(--good)}
.gmfb.no b{color:var(--bad)}
.gmfinal{font-family:var(--display);font-size:34px;font-weight:800;margin:8px 0}
.gslegend{display:flex;flex-wrap:wrap;gap:4px 16px;font-size:14px}
.gstar{min-width:32px}
.stgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:8px;margin-top:12px}
.stbtn{border:1px solid var(--evm-edge);border-radius:4px;padding:10px 12px;background:var(--panel);text-align:left;cursor:pointer;display:flex;flex-direction:column;gap:2px}
.stbtn:hover{border-color:var(--violet)}
.stbtn b{font-family:var(--display);font-size:16.5px;font-weight:600}
.stbtn span{font-size:12.5px;color:var(--muted)}
.stbtn .bar{height:5px;margin-top:6px}

/* app */
.grid{display:grid;grid-template-columns:minmax(300px,370px) minmax(0,1fr);gap:18px;align-items:start}
.rail{background:var(--evm);border:1px solid var(--evm-edge);border-radius:14px;box-shadow:inset 0 1px 0 #fff;position:sticky;top:calc(env(safe-area-inset-top,0px) + 10px);max-height:calc(100vh - 20px);display:flex;flex-direction:column;min-width:0}
.tabs{display:flex;flex-wrap:wrap;gap:2px;padding:6px 8px 0;border-bottom:1px solid var(--evm-edge)}
.tabs button{border:0;background:transparent;padding:8px 9px;cursor:pointer;color:var(--muted);border-bottom:2px solid transparent;font-weight:500;font-size:14px}
.tabs button[aria-selected="true"]{color:var(--ink);border-bottom:3px solid var(--evmblue);font-weight:600}
.pane{padding:14px;overflow:auto;min-height:0}
.pane h3{font-size:16px;font-weight:700;margin-bottom:4px}
.hint{color:var(--muted);font-size:13px;margin:0 0 10px}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.between{justify-content:space-between}
.stack{display:flex;flex-direction:column;gap:10px}
.sl{display:grid;grid-template-columns:24px minmax(0,1fr) auto 26px;gap:4px 8px;align-items:center;padding:8px 10px;margin-bottom:6px;background:var(--panel);border:1px solid var(--evm-edge);border-radius:4px}
.sn{width:24px;height:24px;border-radius:3px;color:#fff;font-weight:700;font-size:12.5px;display:grid;place-items:center;text-shadow:0 0 2px rgba(0,0,0,.35)}
.lamp{width:10px;height:10px;border-radius:50%;background:#C8CBD0;box-shadow:inset 0 1px 1px rgba(0,0,0,.25);flex:none}
.lamp.on{background:var(--lamp);box-shadow:0 0 0 3px rgba(226,35,26,.18),0 0 8px rgba(226,35,26,.7)}
.sw{display:inline-block;width:12px;height:12px;border-radius:3px;flex:none}
.sl .nm{display:flex;flex-direction:column;min-width:0;line-height:1.25}
.sl .nmt{font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sl .seatc{font-size:12.5px;color:var(--muted)}
.sl .val{display:flex;align-items:center;gap:6px}
.sl .val input{width:66px;text-align:right;padding:2px 6px;border:1px solid var(--line);border-radius:6px;background:var(--sunk)}
.sl .delta{font-size:12px;color:var(--muted);min-width:48px;text-align:right}
.sl input[type=range]{grid-column:2 / 4;width:100%;accent-color:var(--c,var(--violet))}
.lock{border:0;background:transparent;cursor:pointer;color:#A3A6B8;padding:3px;border-radius:5px;display:grid;place-items:center}
.lock[aria-pressed="true"]{color:#fff;background:var(--evmblue)}
.sumline{font-size:13px;color:var(--muted);margin-top:8px}
.swingbox{background:var(--panel);border:1px solid var(--evm-edge);border-radius:4px;padding:12px}
.swingbox .ends{display:grid;grid-template-columns:minmax(0,1fr) auto minmax(0,1fr);gap:8px;align-items:end}
.swingbox label{display:flex;flex-direction:column;gap:3px;font-size:12.5px;color:var(--muted);min-width:0}
.swingbox label.row{flex-direction:row;align-items:center;gap:8px;font-size:14px;color:var(--ink)}
.swingbox select{width:100%}
.swingbox input[type=range]{width:100%;margin-top:12px;accent-color:var(--evmblue)}
.swingread{font-family:var(--display);font-size:17px;font-weight:600;text-align:center;margin-top:4px}
.scale{display:flex;justify-content:space-between;font-size:12px;color:var(--muted)}
.presets{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.presets button{text-align:left;justify-content:flex-start;padding:8px 10px;line-height:1.3}
.mini{border-left:4px solid var(--evmblue);background:var(--panel);padding:8px 12px}
.mini .v{font-family:var(--display);font-weight:600;font-size:16px}

.main{display:flex;flex-direction:column;gap:18px;min-width:0}
.card{background:var(--panel);border-top:3px solid var(--ink);padding:14px 0 6px;min-width:0}
.card > h3{font-size:19px;font-weight:700}
.headline{display:flex;flex-wrap:wrap;gap:6px 12px;align-items:center;margin-bottom:4px}
.headline h2{font-size:32px;font-weight:800;font-stretch:108%;line-height:1.05}
.tag{display:inline-block;font-size:13px;color:var(--muted)}
.tag + .tag::before{content:"/";margin:0 8px 0 2px;color:var(--evm-edge)}
.tag.warn{color:var(--warn);font-weight:600}
.verdict{font-family:var(--display);font-size:19px;font-weight:600;margin:4px 0 12px}
.verdict .lead{color:var(--ink);box-shadow:inset 0 -.42em 0 var(--violet-soft)}
.chamber{display:grid;grid-template-columns:minmax(0,1.15fr) minmax(0,1fr);gap:20px;align-items:start}
@media (max-width:1100px){.chamber{grid-template-columns:minmax(0,1fr)}}
.hemi svg{width:100%;height:auto;display:block}
table{border-collapse:collapse;width:100%;font-size:14px}
th,td{padding:6px 6px;text-align:right;border-bottom:1px solid var(--line)}
th{font-weight:600;color:var(--muted);font-size:12.5px}
td:first-child,th:first-child{text-align:left}
.tw{overflow-x:auto}
.pname{display:flex;align-items:center;gap:7px;min-width:0}
.pname span:last-child{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:210px}
.up{color:var(--good)} .down{color:var(--bad)}
.bar{height:7px;border-radius:4px;background:var(--sunk);overflow:hidden;min-width:60px;display:flex}
.bar i{display:block;height:100%}
.charts{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px 22px;margin-top:10px}
@media (max-width:760px){.charts{grid-template-columns:minmax(0,1fr)}}
.charts figure{margin:0;min-width:0;border-top:1px solid var(--line);padding-top:10px}
.charts figure.wide{grid-column:1 / -1}
.charts figcaption{display:flex;justify-content:space-between;gap:8px;align-items:center;flex-wrap:wrap;font-family:var(--display);font-weight:600;font-size:16px;margin-bottom:2px}
.charts .cap2{font-size:12.5px;color:var(--muted);margin:0 0 6px}
.charts svg{width:100%;height:auto;display:block;overflow:visible}

// ---------- data ----------
function fromEmbedded(u){
  const el = document.getElementById('d:'+u); if(!el) return null;
  const bin = atob(el.textContent.trim()); const a = new Uint8Array(bin.length);
  for(let i=0;i<bin.length;i++) a[i] = bin.charCodeAt(i);
  el.remove();
  return JSON.parse(pako.ungzip(a, {to:'string'}));
}
const BASE = 'source/';
async function getJSON(u){ const e = fromEmbedded(u); if(e) return e; const r = await fetch(BASE+u); if(!r.ok) throw new Error(u+' '+r.status); return r.json(); }

function pName(c){ return (S.partyEdit[c] && S.partyEdit[c].n) || (LANG === 'hi' && HI_PARTY[c]) || (META[c] && META[c].n) || c; }
function pColor(c){ return (S.partyEdit[c] && S.partyEdit[c].c) || (META[c] && META[c].c) || '#9aa0aa'; }
function allyColor(name, members){ return members.length ? pColor(members[0]) : '#9aa0aa'; }

function prepare(raw){
  const P = raw.parties.length;
  const seats = raw.seats.map((s, i) => {
    const v = new Float64Array(P);
    const flat = s[4];
    for(let k=0;k<flat.length;k+=2) v[flat[k]] += flat[k+1];
    v[P-1] += s[5];
    let tot = 0; for(let k=0;k<P;k++) tot += v[k];
    return {i, no:s[0], name:s[1], cat:s[2], r:s[3], v, tot, m:s[6]||1, m2:s[7]||null,
            key: raw.mapkeys ? raw.mapkeys[i] : (s[0] + (raw.mapoff||0))};
  });
  return {raw, P, seats, parties:raw.parties, regions:raw.regions||[], N: seats.reduce((a,s)=>a+s.m,0)};
}

function alliancesOf(){
  const a = Object.assign({}, E.raw.alliances, S.allyEdit);
  for(const k in a) if(!a[k]) delete a[k];
  return a;
}

function buildUnits(){
  const P = E.P, codes = E.parties;
  const totAll = E.seats.reduce((a,s)=>a+s.tot,0);
  const pv = new Float64Array(P); E.seats.forEach(s => { for(let k=0;k<P;k++) pv[k]+=s.v[k]; });
  const pseats = new Float64Array(P);
  E.seats.forEach(s => { let b=-1,bi=-1; for(let k=0;k<P-1;k++) if(s.v[k]>b){b=s.v[k];bi=k;} if(bi>=0) pseats[bi]+=s.m; });
  const ally = S.mode === 'alliance' ? alliancesOf() : {};
  const groups = new Map();
  for(let k=0;k<P;k++){
    const c = codes[k];
    let key = c, name = pName(c);
    if(c !== 'OTH' && ally[c]){ key = 'A:'+ally[c]; name = allyName(ally[c]); }
    if(!groups.has(key)) groups.set(key, {key, name, members:[], vote:0, seats:0});
    const g = groups.get(key); g.members.push(k); g.vote += pv[k]; g.seats += pseats[k];
  }
  let list = [...groups.values()];
  list.forEach(g => g.members.sort((a,b)=>pv[b]-pv[a]));
  // small units fold into Others
  list.sort((a,b)=>b.vote-a.vote);
  const keep = [], oth = {key:'OTH', name:t('others'), members:[], vote:0, seats:0};
  list.forEach(g => {
    if(g.key === 'OTH'){ oth.members.push(...g.members); oth.vote += g.vote; oth.seats += g.seats; return; }
    const share = g.vote/totAll;
    if(g.seats > 0 || (keep.length < 14 && share >= 0.004)) keep.push(g);
    else { oth.members.push(...g.members); oth.vote += g.vote; oth.seats += g.seats; }
  });
  labExtraUnits().forEach(g => keep.push(g));
  keep.push(oth);
  keep.forEach(g => {
    g.base = 100*g.vote/totAll;
    g.color = g.key === 'OTH' ? 'var(--muted)' : (g.key.startsWith('A:') ? allyColor(g.name, g.members.map(k=>codes[k])) : pColor(g.key));
    g.hex = g.key === 'OTH' ? '#9aa0aa' : (g.key.startsWith('A:') ? allyColor(g.name, g.members.map(k=>codes[k])) : pColor(g.key));
    if(g.labKind) g.color = g.hex = labColor(g, keep);
  });
  U = keep;
  // unit index per party
  E.unitOf = new Int32Array(P);
  U.forEach((g,ui) => g.members.forEach(k => E.unitOf[k] = ui));
  // per-seat unit votes (alliance members merged, transfer applied to non-lead members)
  const tr = S.transfer/100;
  E.seats.forEach(s => {
    const u = new Float64Array(U.length);
    const lead = new Float64Array(U.length);
    U.forEach((g,ui) => { let mx=0,sum=0; g.members.forEach(k=>{ sum+=s.v[k]; if(s.v[k]>mx) mx=s.v[k]; }); lead[ui]=mx;
      u[ui] = g.key==='OTH' || !g.key.startsWith('A:') ? sum : mx + tr*(sum-mx); });
    let t=0; for(let k=0;k<u.length;k++) t+=u[k];
    s.u = u; s.ut = t || 1;
    s.base = u.map(x => x/(t||1));
  });
  // the real result (before any what-if from the lab): base seats and base winners always describe this
  E.hist = histShares();
  const bs = winners(E.seats.map(s=>s.base), null);
  labApply(bs.win);
  const totU = E.seats.reduce((a,s)=>a+s.ut,0);
  U.forEach((g,ui) => { g.base = 100*E.seats.reduce((a,s)=>a+s.u[ui],0)/totU; });
  U.forEach((g,ui)=> g.baseSeats = bs.counts[ui]);
  E.baseWin = bs.win;
  E.core = S.method === 'core' ? coreShares() : null;
}

// ---------- earlier elections, seat by seat ----------
async function loadPrev(raw){
  const list = (await bundle(entry().file)).slice().sort((a, b) => a.year - b.year || a.label.localeCompare(b.label)), i = list.findIndex(x => x.id === raw.id);
  return list.slice(Math.max(0, i - 3), Math.max(0, i)).reverse().map(p => ({raw: p, idx: new Map(p.seats.map((s, j) => [seatKey(p, s), j]))}));
}
function histShares(){
  const prev = E.prev || [], n = U.length, pc = E.parties;
  const keys = E.raw.seats.map(s => seatKey(E.raw, s));
  return E.seats.map((s, i) => prev.map(p => {
    const j = p.idx.get(keys[i]); if(j == null) return null;
    const ps = p.raw.seats[j], v = new Float64Array(n); let tot = 0;
    for(let k = 0; k < ps[4].length; k += 2){ const c = pc.indexOf(p.raw.parties[ps[4][k]]), ui = c >= 0 ? E.unitOf[c] : n - 1; v[ui] += ps[4][k + 1]; tot += ps[4][k + 1]; }
    v[n - 1] += ps[5] || 0; tot += ps[5] || 0;
    if(!(tot > 0)) return null;
    for(let k = 0; k < n; k++) v[k] /= tot;
    return v;
  }));
}
const MOM_W = [0.5, 0.25, 0.15, 0.10];
// core vote of a party in a seat: its floor over the last elections (a share of it, so a core is never the whole vote)
function coreShares(){
  const H = E.hist || [], n = U.length;
  return E.seats.map((s, i) => { const c = new Float64Array(n), hs = (H[i] || []).filter(Boolean);
    for(let u = 0; u < n; u++){ let m = s.base[u]; hs.forEach(h => { if(h[u] < m) m = h[u]; }); c[u] = (hs.length ? 0.85 : 0.5) * m; }
    return c; });
}

// ---------- what-if lab: reshapes each seat's vote shares before any swing (new party, split, turnout, sitting-member penalty) ----------
const hash01 = x => { const v = Math.sin(x * 12.9898 + 78.233) * 43758.5453; return v - Math.floor(v); };
function labTurnoutOn(L){ return !!(L && L.to && (Object.values(L.to.p || {}).some(v => v) || Object.values(L.to.r || {}).some(v => v))); }
function labActive(){ const L = S.lab; return !!(L && ((L.np && L.np.on) || (L.sp && L.sp.on) || (L.pen && L.pen.on) || (L.mom && L.mom.on) || labTurnoutOn(L))); }
function labExtraUnits(){
  const L = S.lab, out = []; if(!L) return out;
  if(L.sp && L.sp.on && L.sp.key) out.push({key:'SPLIT:' + L.sp.key, name:L.sp.name || (t('labFaction')), members:[], vote:0, seats:0, labKind:'split', parent:L.sp.key});
  if(L.np && L.np.on) out.push({key:'NEW:party', name:L.np.name || t('labNewName'), members:[], vote:0, seats:0, labKind:'new', hexOwn:L.np.color || '#00A6A6'});
  return out;
}
function mixHex(a, b, f){ const pa = a.replace('#',''), pb = b.replace('#',''); const r = i => Math.round(parseInt(pa.substr(i,2),16)*(1-f) + parseInt(pb.substr(i,2),16)*f).toString(16).padStart(2,'0'); return '#' + r(0) + r(2) + r(4); }
function labColor(g, list){
  if(g.labKind === 'new') return g.hexOwn;
  const par = list.find(x => x.key === g.parent); const ph = par && /^#[0-9a-f]{6}$/i.test(par.hex) ? par.hex : '#8A8F98';
  return (S.lab.sp && S.lab.sp.color) || mixHex(ph, '#8E5BD0', .55);
}
function labApply(origWin){
  const L = S.lab; if(!L || !labActive()) { S.labInfo = null; return; }
  const n = U.length, idx = k => U.findIndex(g => g.key === k), seats = E.seats, info = {};
  // 0. momentum baseline: a weighted average of the last elections instead of only the latest
  if(L.mom && L.mom.on && E.hist){
    seats.forEach((s, i) => { const hs = E.hist[i] || [], w = [MOM_W[0]], parts = [s.base]; hs.forEach((h, k) => { if(h){ w.push(MOM_W[k + 1]); parts.push(h); } });
      const ws = w.reduce((a, b) => a + b, 0), tot = s.u.reduce((a, b) => a + b, 0); if(parts.length < 2 || !(tot > 0)) return;
      for(let u = 0; u < n; u++){ let v = 0; parts.forEach((pt, k) => v += w[k] * pt[u]); s.u[u] = v / ws * tot; } });
    info.mom = true;
  }
  // 1. turnout: scale the votes of a party's voters everywhere, or of every voter in a state or district
  if(labTurnoutOn(L)){
    const fu = U.map(g => Math.max(0, 1 + ((L.to.p || {})[g.key] || 0) / 100));
    seats.forEach(s => { const rn = s.r >= 0 ? E.regions[s.r] : null, fr = Math.max(0, 1 + (((L.to.r || {})[rn]) || 0) / 100); for(let k = 0; k < n; k++) s.u[k] *= fu[k] * fr; });
  }
  // 2. split a party: a share of its voters goes to a new faction, a little differently in every seat
  if(L.sp && L.sp.on){
    const a = idx(L.sp.key), b = idx('SPLIT:' + L.sp.key);
    if(a >= 0 && b >= 0){ const f = Math.max(0, Math.min(1, (L.sp.share || 0) / 100)), v = (L.sp.spread || 0) / 100;
      seats.forEach(s => { const fi = Math.max(0, Math.min(1, f * (1 + v * (hash01(s.no * 31 + 7) - .5) * 2))), m = s.u[a] * fi; s.u[a] -= m; s.u[b] += m; }); }
  }
  // 3. a new party: it takes a fraction of each chosen party's voters (the weights say how much of whose), with local variation
  if(L.np && L.np.on){
    const nk = U.findIndex(g => g.labKind === 'new');
    if(nk >= 0){
      const w = new Float64Array(n), src = Object.entries(L.np.from || {}).filter(([, wt]) => wt > 0);
      if(src.length) src.forEach(([k, wt]) => { const j = idx(k); if(j >= 0 && j !== nk) w[j] = wt; }); else for(let k = 0; k < n; k++) if(k !== nk) w[k] = 1;
      const v = (L.np.spread == null ? 40 : L.np.spread) / 100, gi = seats.map(s => 1 + v * (hash01(s.no * 17 + 3) - .5) * 2);
      const totalV = seats.reduce((a, s) => a + s.u.reduce((x, y) => x + y, 0), 0), want = Math.max(0, Math.min(60, L.np.share || 0)) / 100 * totalV;
      const taken = lam => { let tot = 0; seats.forEach((s, i) => { for(let k = 0; k < n; k++) if(w[k]) tot += Math.min(1, lam * w[k] * gi[i]) * s.u[k]; }); return tot; };
      let lo = 0, hi = 1; while(taken(hi) < want && hi < 1e4) hi *= 2;
      for(let it = 0; it < 40; it++){ const mid = (lo + hi) / 2; if(taken(mid) < want) lo = mid; else hi = mid; }
      const lam = (lo + hi) / 2, gotV = taken(lam);
      seats.forEach((s, i) => { let got = 0; for(let k = 0; k < n; k++) if(w[k]){ const f = Math.min(1, lam * w[k] * gi[i]), m = s.u[k] * f; s.u[k] -= m; got += m; } s.u[nk] += got; });
      info.np = {asked: L.np.share || 0, got: 100 * gotV / totalV};
    }
  }
  // 4. sitting-member penalty: the party that holds a seat loses points there, not everywhere
  if(L.pen && L.pen.on && L.pen.pts > 0){
    seats.forEach((s, i) => { const w0 = origWin[i], tot = s.u.reduce((a, b) => a + b, 0); if(!(tot > 0) || s.u[w0] == null) return;
      const cut = Math.min(s.u[w0], L.pen.pts / 100 * tot), rest = tot - s.u[w0]; if(rest <= 0) return;
      s.u[w0] -= cut; for(let k = 0; k < n; k++) if(k !== w0) s.u[k] += cut * s.u[k] / rest; });
  }
  seats.forEach(s => { let t0 = 0; for(let k = 0; k < n; k++) t0 += s.u[k]; s.ut = t0 || 1; s.base = s.u.map(x => x / s.ut); });
  S.labInfo = info;
}

// ---------- engine ----------
function winners(shares, overrides){
  const counts = new Float64Array(U.length), win = [], second = [];
  const othI = U.length-1;
  E.seats.forEach((s, i) => {
    const x = shares[i];
    let order = [...x.keys()].sort((a,b)=>x[b]-x[a]);
    // "Others" is a bundle of small parties; it can only win if it is genuinely a single party's lead
    if(order[0] === othI && U[othI].members.length > 1){
      const realTop = s.v.reduce((b,v,k)=> (k < E.P-1 && E.unitOf[k]===othI && v>b.v) ? {v,k} : b, {v:-1,k:-1});
      const topShare = realTop.v / s.tot;
      if(topShare < x[order[1]]) order = order.slice(1).concat(othI);
    }
    let w = order[0];
    if(overrides && overrides[s.no] != null){ const ui = U.findIndex(g=>g.key===overrides[s.no]); if(ui>=0) w = ui; }
    win[i] = w; second[i] = order[0] === w ? order[1] : order[0];
    counts[w] += 1;
    if(s.m > 1){
      // two-member seat: the winning party's second candidate takes the second seat if it out-polled every rival
      const r2 = order.find(k => k !== w);
      let w2 = r2;
      if(s.m2 && E.unitOf[s.m2[0]] === w){ const lv = s.v[s.m2[0]] || 1; if(x[w] * s.m2[1] / lv > x[r2]) w2 = w; }
      counts[w2] += s.m-1;
    }
  });
  return {counts, win, second};
}

function simulate(T, noise){
  // T: target shares (percent) per unit; returns per-seat share arrays
  const n = U.length, method = S.method;
  const base = U.map(g=>g.base);
  const reg = S.regional, res = S.reserved;
  const regDelta = (r, ui) => { const o = reg[E.regions[r]]; return o && o[U[ui].key] ? o[U[ui].key]/100 : 0; };
  // core and swing voters: a swing first moves the swing pool, the core only moves with a wave
  const core = method === 'core' ? (E.core || (E.core = coreShares())) : null, wv = {none: 0, mild: .4, strong: 1}[S.wave || 'none'];
  let Cn = null, te = null, fc = null, fs = null;
  if(core){ Cn = new Float64Array(n); const tw = E.seats.reduce((a, s) => a + s.ut, 0); E.seats.forEach((s, i) => { for(let u = 0; u < n; u++) Cn[u] += core[i][u] * s.ut; }); for(let u = 0; u < n; u++) Cn[u] = 100 * Cn[u] / tw; te = T.slice(); fc = new Float64Array(n); fs = new Float64Array(n); }
  const coreFactors = () => { for(let u = 0; u < n; u++){ const B = base[u], C = Math.min(Cn[u], B), Sp = B - C, Tu = te[u];
      if(Tu >= B){ const den = Sp + wv * C; if(den > 1e-9){ const dl = (Tu - B) / den; fs[u] = 1 + dl; fc[u] = 1 + wv * dl; } else { fs[u] = fc[u] = B > 0 ? Tu / B : 1; } }
      else if(Tu >= C){ fc[u] = 1; fs[u] = Sp > 1e-9 ? (Tu - C) / Sp : 1; }
      else { fs[u] = 0; fc[u] = C > 0 ? Math.max(Tu / C, 1 - wv) : 1; } } };
  let f = T.map((t,ui) => base[ui] > 0 ? t/base[ui] : 0);      // proportional factors
  let d = T.map((t,ui) => (t-base[ui])/100);                    // uniform shifts
  let out;
  for(let pass=0; pass<5; pass++){
    if(core) coreFactors();
    out = E.seats.map((s, i) => {
      const x = new Float64Array(n);
      let sum = 0;
      for(let ui=0; ui<n; ui++){
        const b = s.base[ui];
        let y;
        if(method === 'prop') y = b * f[ui];
        else if(core){ const c0 = core[i][ui]; y = c0 * fc[ui] + (b - c0) * fs[ui]; }
        else y = b > 0 ? Math.max(0.0005, b + d[ui]) : 0;
        if(b > 0 || y > 0){
          if(s.r >= 0) y += regDelta(s.r, ui);
          if(s.cat === 'SC' && res.SC[U[ui].key]) y += res.SC[U[ui].key]/100;
          if(s.cat === 'ST' && res.ST[U[ui].key]) y += res.ST[U[ui].key]/100;
        }
        if(noise) y = y + noise(i, ui, y);
        if(b === 0 && T[ui] > 0 && base[ui] === 0) y = Math.max(y, T[ui]/100 * 0.8); // new party with no history: spread evenly
        y = Math.max(0, y); x[ui] = y; sum += y;
      }
      if(sum > 0) for(let ui=0; ui<n; ui++) x[ui] /= sum;
      return x;
    });
    if(!S.fixNational && !noise) break;
    // recalibrate so national totals match the targets
    const tot = E.seats.reduce((a,s)=>a+s.ut,0);
    const cur = new Float64Array(n);
    out.forEach((x,i)=>{ const w = E.seats[i].ut; for(let ui=0;ui<n;ui++) cur[ui]+=x[ui]*w; });
    let err = 0;
    for(let ui=0; ui<n; ui++){
      const c = 100*cur[ui]/tot, t = T[ui];
      err = Math.max(err, Math.abs(c-t));
      if(c > 0){ f[ui] *= t/c; d[ui] += (t-c)/100; if(te) te[ui] = Math.max(0, te[ui] * t / c); }
    }
    if(err < 0.02) break;
  }
  return out;
}

function targets(){ return U.map(g => S.T[g.key] != null ? S.T[g.key] : g.base); }

function run(){
  S.realHit = null;
  const T = realisticClamp(targets());
  const shares = simulate(T);
  const w = winners(shares, S.overrides);
  RES = {T, shares, ...w};
  renderResult();
}

// ---------- Monte Carlo ----------
function gauss(){ let u=0,v=0; while(!u)u=Math.random(); while(!v)v=Math.random(); return Math.sqrt(-2*Math.log(u))*Math.cos(2*Math.PI*v); }
async function runMC(progress){
  const N = S.mcSig.n, n = U.length, T0 = targets();
  const counts = U.map(()=>[]);
  const seatWins = E.seats.map(()=>new Float64Array(n));
  const maj = Math.floor(E.N/2)+1;
  const majHits = new Float64Array(n), largest = new Float64Array(n), hung = {v:0};
  const R = E.regions.length;
  for(let it=0; it<N; it++){
    const T = T0.map(t => Math.max(0, t + gauss()*S.mcSig.nat*Math.sqrt(Math.max(t,0.5)/25)));
    const st = T.reduce((a,b)=>a+b,0); for(let k=0;k<n;k++) T[k] = T[k]*100/st;
    const rn = []; for(let r=0;r<Math.max(R,1);r++){ const a = new Float64Array(n); for(let k=0;k<n;k++) a[k]=gauss()*S.mcSig.reg/100; rn.push(a); }
    const sn = S.mcSig.seat/100;
    const shares = simulate(T, (i, ui, y) => {
      const s = E.seats[i]; const r = s.r >= 0 ? s.r : 0;
      return (rn[r][ui] + gauss()*sn) * Math.sqrt(Math.max(y,0.01)/0.25);
    });
    const w = winners(shares, S.overrides);
    let best = 0;
    for(let k=0;k<n;k++){ counts[k].push(w.counts[k]); if(w.counts[k] >= maj) majHits[k]++; if(w.counts[k] > w.counts[best]) best = k; }
    largest[best]++;
    if(!w.counts.some(c => c >= maj)) hung.v++;
    w.win.forEach((u,i) => seatWins[i][u]++);
    if(it % 25 === 24){ progress && progress((it+1)/N); await new Promise(r=>setTimeout(r,0)); }
  }
  const q = (arr,p) => { const a = [...arr].sort((x,y)=>x-y); return a[Math.min(a.length-1, Math.floor(p*a.length))]; };
  S.mc = { n:N, units: U.map((g,k)=>({key:g.key, lo:q(counts[k],.05), med:q(counts[k],.5), hi:q(counts[k],.95), pMaj:majHits[k]/N, pLargest:largest[k]/N, all:counts[k]})),
    hung: hung.v/N, seatP: seatWins.map(a=>Array.from(a, x=>x/N)), sig: JSON.stringify(sigOf()) };
}
function sigOf(){ return [S.eid, S.mode, S.method, targets().map(x=>+x.toFixed(2)), S.regional, S.reserved, S.overrides, S.transfer, S.allyEdit]; }

function drawHemicycle(el, groups, N, maj, center, sub){
  const W = 520, H = 290, cx = W/2, cy = H - 18;
  const rows = Math.max(4, Math.round(Math.sqrt(N/3.2)));
  const R1 = 240, R0 = R1 * (N > 300 ? .34 : .40);
  const radii = d3.range(rows).map(r => R0 + (R1-R0)*(rows===1?0:r/(rows-1)));
  const sumR = d3.sum(radii);
  const per = radii.map(r => Math.round(N*r/sumR)); per[rows-1] += N - d3.sum(per);
  const dotR = Math.min(9, (R1-R0)/rows*0.42, Math.PI*R1/per[rows-1]*0.42);
  const pts = [];
  radii.forEach((r, ri) => { const n = per[ri]; for(let j=0;j<n;j++){ const a = Math.PI - (n===1?Math.PI/2:Math.PI*j/(n-1)); pts.push({a, r, x: cx + r*Math.cos(a), y: cy - r*Math.sin(a)}); } });
  pts.sort((p,q)=> q.a - p.a || p.r - q.r);
  const fills = []; groups.forEach(g => { for(let c=0;c<g.n;c++) fills.push(g.c); });
  el.innerHTML = `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Seat chart">
    ${pts.map((p,i)=>`<circle cx="${p.x.toFixed(1)}" cy="${p.y.toFixed(1)}" r="${dotR.toFixed(2)}" fill="${fills[i]||'#ccc'}"/>`).join('')}
    <line x1="${cx}" y1="${cy - R1 - 14}" x2="${cx}" y2="${cy - R0 + 18}" stroke="var(--ink)" stroke-width="1.4" stroke-dasharray="3 3"/>
    <text x="${cx}" y="${cy - 2}" text-anchor="middle" font-family="var(--display)" font-size="40" font-weight="800" fill="var(--ink)">${center}</text>
    <text x="${cx}" y="${cy - 46}" text-anchor="middle" font-size="12.5" fill="var(--muted)">${esc(sub)}</text></svg>`;
}

function computeTargets(ui, val, T){
  T = T || targets(); val = Math.max(0, Math.min(100, val));
  const locked = U.map((g,k) => k !== ui && S.locks[g.key]);
  const lockedSum = T.reduce((a,x,k)=> a + (locked[k]?x:0), 0);
  val = Math.min(val, 100 - lockedSum);
  const free = U.map((g,k)=>k).filter(k => k !== ui && !locked[k]);
  const freeSum = free.reduce((a,k)=>a+T[k],0), rest = 100 - lockedSum - val;
  T[ui] = val;
  free.forEach(k => T[k] = freeSum > 0 ? T[k]*rest/freeSum : rest/free.length);
  return T;
}
function setTarget(ui, val){ const T = computeTargets(ui, val); U.forEach((g,k)=> S.T[g.key] = T[k]); }
function setAll(T){ const s = T.reduce((a,b)=>a+b,0) || 1; U.forEach((g,k)=> S.T[g.key] = Math.max(0,T[k])*100/s); }

// Easy tab: one swing slider between two sides + presets
function easyPair(){
  const real = U.map((g,k)=>k).filter(k=>U[k].key!=='OTH').sort((a,b)=>U[b].base-U[a].base);
  let a = U.findIndex(g=>g.key===S.swing.a), b = U.findIndex(g=>g.key===S.swing.b);
  if(a < 0 || U[a].key==='OTH') a = real[0];
  if(b < 0 || b === a || U[b].key==='OTH') b = real.find(k=>k!==a);
  S.swing.a = U[a].key; S.swing.b = U[b].key;
  return [a, b, real];
}
function applySwing(){
  const [a, b] = easyPair(), pts = S.swing.pts, T = baseT();
  const mv = pts >= 0 ? Math.min(pts, T[a]) : -Math.min(-pts, T[b]);
  T[a] -= mv; T[b] += mv; S.T = {}; setAll(T); run();
}

function preset(kind, a, b, inc){

  if(kind === 'same'){ S.T = {}; S.regional = {}; S.reserved = {SC:{},ST:{}}; S.overrides = {}; run(); renderPane(); return; }
  if(kind === 'repeat'){ repeatSwing(); return; }
  if(kind === 'trend'){ let f = 0; for(let i=0;i<(S.ahead||1);i++) f += Math.pow(0.6, i); repeatSwing(f); return; }
  if(kind === 'waveA') T = computeTargets(a, T[a] + 5, T);
  if(kind === 'waveB') T = computeTargets(b, T[b] + 5, T);
  if(kind === 'close'){ const avg = (T[a]+T[b])/2; T[a] = avg; T[b] = avg; }
  if(kind === 'third'){ const take = Math.min(3, T[a]) + Math.min(3, T[b]); T[a] = Math.max(0,T[a]-3); T[b] = Math.max(0,T[b]-3);

  S.T = {}; setAll(T); run(); renderPane();
}

function solveSeats(k, want){

  const T0 = targets(), lockedSum = U.reduce((a,g,j)=> a + (j!==k && S.locks[g.key] ? T0[j] : 0), 0);

  if(want <= 0){ S.T = save; setTarget(k, 0); run(); renderPane(); return; }
  for(let it=0; it<22; it++){ const mid = (lo+hi)/2; if(seatsAt(mid) >= want) hi = mid; else lo = mid; }

async function repeatSwing(factor){

  const list = (await bundle(ent.file)).filter(e => e.year < ent.year).sort((a,b)=>b.year-a.year);
  if(!list.length){ toast(t('noEarlier')); return; }
  const prev = list[0];
  const share = e => { const r = {}; let tot = 0; e.seats.forEach(s => { for(let k=0;k<s[4].length;k+=2){ const p = e.parties[s[4][k]]; r[p]=(r[p]||0)+s[4][k+1]; tot+=s[4][k+1]; } tot += s[5]; }); for(const p in r) r[p] = 100*r[p]/tot; return r; };

  U.forEach((g,k) => { if(g.key==='OTH') return; const d = g.members.map(m=>E.parties[m]).reduce((s,c)=> s + ((b[c]||0) - (a[c]||0)), 0); T[k] = Math.max(0, g.base + d*factor); });

  toast(factor === 1 ? t('repeated',{a:prev.label, b:ent.label}) : t('trendDone',{a:prev.label, b:ent.label, y:nextYear(ent)}));
  run(); renderPane();
}

// Pinch / drag / button zoom for the seat map.
const MZ = {k:1, x:0, y:0, max:10};
function mzBox(){ return $('#mapz').getBoundingClientRect(); }
function mzApply(){
  const z = $('#mapz'), m = $('#map'), r = z.getBoundingClientRect();
  MZ.k = Math.max(1, Math.min(MZ.max, MZ.k));
  MZ.x = Math.min(0, Math.max(r.width * (1 - MZ.k), MZ.x)); MZ.y = Math.min(0, Math.max(m.offsetHeight * (1 - MZ.k) , MZ.y));
  if(MZ.k === 1){ MZ.x = 0; MZ.y = 0; }
  m.style.transform = MZ.k === 1 ? '' : `translate(${MZ.x}px,${MZ.y}px) scale(${MZ.k})`;
  z.classList.toggle('zoomed', MZ.k > 1); $('#zReset').hidden = MZ.k === 1;
}
function resetZoom(){ MZ.k = 1; MZ.x = 0; MZ.y = 0; if($('#map')) mzApply(); }
function mzAt(f, cx, cy){ // zoom by factor f keeping point (cx, cy) in the container fixed
  const k0 = MZ.k, k1 = Math.max(1, Math.min(MZ.max, k0 * f));
  MZ.x = cx - (cx - MZ.x) * k1 / k0; MZ.y = cy - (cy - MZ.y) * k1 / k0; MZ.k = k1; mzApply();
}
function zoomToSeat(i){
  const p = $('#map path.seat[data-i="' + i + '"]'); if(!p) return;
  const z = $('#mapz'), m = $('#map'), zr = z.getBoundingClientRect();
  MZ.k = 1; mzApply();
  const pr = p.getBoundingClientRect(), mr = m.getBoundingClientRect();
  const cx = pr.left + pr.width/2 - mr.left, cy = pr.top + pr.height/2 - mr.top;
  const k = Math.max(1, Math.min(6, 0.45 * Math.min(zr.width / Math.max(pr.width, 1), zr.height / Math.max(pr.height, 1))));
  MZ.k = k; MZ.x = zr.width/2 - cx*k; MZ.y = zr.height/2 - cy*k; mzApply();
}
(function initZoom(){
  const z = $('#mapz'), ptr = new Map(); let g = null, moved = false;
  $('#zIn').onclick = () => { const r = mzBox(); mzAt(1.6, r.width/2, r.height/2); };

  z.addEventListener('pointerdown', e => { if(e.target.closest('.zoombtns')) return; ptr.set(e.pointerId, {x:e.clientX, y:e.clientY}); moved = false;
    g = {k:MZ.k, x:MZ.x, y:MZ.y, d:null, c:null, sx:e.clientX, sy:e.clientY}; });

    const r = mzBox();
    if(ptr.size >= 2){ const [a, b] = [...ptr.values()], d = Math.hypot(a.x-b.x, a.y-b.y), c = {x:(a.x+b.x)/2 - r.left, y:(a.y+b.y)/2 - r.top};
      if(!g.d){ g.d = d; g.c = c; g.k = MZ.k; g.x = MZ.x; g.y = MZ.y; }
      const k1 = Math.max(1, Math.min(MZ.max, g.k * d / g.d));
      MZ.x = c.x - (g.c.x - g.x) * k1 / g.k; MZ.y = c.y - (g.c.y - g.y) * k1 / g.k; MZ.k = k1; moved = true; mzApply(); return; }

  const up = e => { ptr.delete(e.pointerId); if(ptr.size < 2 && g) g.d = null; if(!ptr.size) setTimeout(() => moved = false, 60); };
  z.addEventListener('pointerup', up); z.addEventListener('pointercancel', up);
  z.addEventListener('click', e => { if(moved){ e.stopPropagation(); e.preventDefault(); } }, true);
})();

const b64u = {
  enc(bytes){ let s = ''; bytes.forEach(b => s += String.fromCharCode(b)); return btoa(s).replace(/\+/g, '-').replace(/\//g, '_').replace(/=+$/, ''); },
  dec(str){ const s = atob(str.replace(/-/g, '+').replace(/_/g, '/')); return Uint8Array.from(s, ch => ch.charCodeAt(0)); },
};
function scenarioForLink(){
  const sc = scenario(); sc.lang = LANG;
  const T = {}; for(const k in sc.T) T[k] = Math.round(sc.T[k] * 100) / 100; sc.T = T;
  for(const k of ['locks', 'regional', 'reserved', 'overrides', 'allyEdit']){ if(sc[k] && !Object.keys(sc[k]).length) delete sc[k]; }
  if(sc.reserved && !Object.keys(sc.reserved.SC || {}).length && !Object.keys(sc.reserved.ST || {}).length) delete sc.reserved;
  if(!Object.keys(sc.partyEdit || {}).length) delete sc.partyEdit;
  return sc;
}
function encodeScenario(sc){ return b64u.enc(pako.deflateRaw(new TextEncoder().encode(JSON.stringify(sc)))); }
function decodeScenario(str){ return JSON.parse(new TextDecoder().decode(pako.inflateRaw(b64u.dec(str)))); }
function shareURL(){ return location.origin + location.pathname + '#s=' + encodeScenario(scenarioForLink()); }
async function bootFromHash(){
  const m = location.hash.match(/^#s=([\w-]+)$/); if(!m) return;
  try{
    const sc = decodeScenario(m[1]);
    if(sc.lang && sc.lang !== LANG){ LANG = sc.lang; applyLang(); await renderHome(); }
    await applyScenario(sc);

}
window.addEventListener('hashchange', () => { if(/^#s=/.test(location.hash) && INDEX) bootFromHash(); });

function wrapText(g, text, x, y, maxW, lh, maxLines){

  g.fillText(line, x, y); return y + lh;
}

function seatPlace(i){ const s = E.seats[i]; return s.name + (S.kind === 'LS' && s.r >= 0 ? ', ' + stName(E.regions[s.r]) : ''); }
function whoAt(i, which, code){ const n = E.names && E.names[i] && E.names[i][which]; return n ? t('factWho', {name: n, party: pName(code)}) : pName(code); }
async function makeFacts(){
  await namesFor(entry().file).then(n => { E.names = (n && n[S.eid]) || E.names || null; });
  const e = E.raw, ent = entry(), P = e.parties, F = [], N = E.N, seats = E.seats;
  const top2 = seats.map((s, i) => { const a = []; for(let k = 0; k < E.P - 1; k++) if(s.v[k] > 0) a.push([k, s.v[k]]); a.sort((x, y) => y[1] - x[1]); return a; });
  const win = i => top2[i][0] && P[top2[i][0][0]];
  const gaps = seats.map((s, i) => ({i, m: top2[i].length > 1 ? top2[i][0][1] - top2[i][1][1] : -1, tot: s.tot})).filter(o => o.m >= 0 && o.tot > 0);
  const add = (id, w, text, seat) => F.push({id, w, text, seat});
  // closest and biggest
  const cl = gaps.slice().sort((a, b) => a.m - b.m)[0];
  if(cl) add('close', 10, t('fxClose', {seat: seatPlace(cl.i), n: fmtN(cl.m), w: whoAt(cl.i, 0, win(cl.i)), r: whoAt(cl.i, 1, P[top2[cl.i][1][0]])}), cl.i);
  const bg = gaps.slice().sort((a, b) => b.m - a.m)[0];
  if(bg && bg.m > 0) add('big', 7, t('fxBig', {seat: seatPlace(bg.i), n: fmtN(bg.m), w: whoAt(bg.i, 0, win(bg.i))}), bg.i);
  const u1k = gaps.filter(o => o.m < 1000).length; if(u1k >= 2) add('u1k', 8, t('fxUnder1k', {n: u1k}));
  const sh = gaps.map(o => ({i: o.i, x: 100 * top2[o.i][0][1] / o.tot})).sort((a, b) => a.x - b.x);
  if(sh.length){ add('low', 6, t('fxLowShare', {seat: seatPlace(sh[0].i), x: fmt1(sh[0].x), w: whoAt(sh[0].i, 0, win(sh[0].i))}), sh[0].i); const hi = sh[sh.length - 1]; add('high', 5, t('fxHighShare', {seat: seatPlace(hi.i), x: fmt1(hi.x), w: whoAt(hi.i, 0, win(hi.i))}), hi.i); }
  const tight = gaps.filter(o => 100 * o.m / o.tot < 1).length; if(tight >= 3) add('tight', 4, t('fxTight', {n: tight}));
  const unopp = seats.map((s, i) => i).filter(i => seats[i].tot <= 0 && e.seats[i][4].length);
  unopp.slice(0, 2).forEach(i => add('unopp', 9, t('fxUnopp', {seat: seatPlace(i), w: whoAt(i, 0, P[e.seats[i][4][0]])}), i));
  // parties
  const won = new Map(), second = new Map(), votes = new Map(); let tv = 0;
  seats.forEach((s, i) => { const m = s.m; if(top2[i][0]) won.set(top2[i][0][0], (won.get(top2[i][0][0]) || 0) + m); if(top2[i][1]) second.set(top2[i][1][0], (second.get(top2[i][1][0]) || 0) + 1);
    for(let k = 0; k < E.P - 1; k++){ votes.set(k, (votes.get(k) || 0) + s.v[k]); } tv += s.tot; });
  const real = k => !SKIP_P.has(P[k]);
  const stat = [...votes.keys()].filter(real).map(k => ({k, v: 100 * votes.get(k) / tv, s: 100 * (won.get(k) || 0) / N, n: won.get(k) || 0, sec: second.get(k) || 0})).filter(o => o.v >= 3);
  const bonus = stat.slice().sort((a, b) => (b.s - b.v) - (a.s - a.v))[0];
  if(bonus && bonus.s - bonus.v > 4) add('bonus', 9, t('fxSeatsVotes', {p: pName(P[bonus.k]), s: fmt1(bonus.s), v: fmt1(bonus.v)}));
  const unlucky = stat.slice().sort((a, b) => (a.s - a.v) - (b.s - b.v))[0];
  if(unlucky && unlucky.v - unlucky.s > 3 && unlucky.k !== (bonus && bonus.k)) add('unlucky', 8, t('fxVotesNoSeats', {p: pName(P[unlucky.k]), v: fmt1(unlucky.v), n: unlucky.n}));
  const rn = stat.slice().sort((a, b) => b.sec - a.sec).find(o => o.sec >= 8 && o.sec > 2 * o.n);
  if(rn) add('runner', 6, t('fxRunner', {p: pName(P[rn.k]), n: rn.sec, m: rn.n}));
  const ind = seats.filter((s, i) => P[(top2[i][0] || [0])[0]] === 'IND').length; if(ind) add('ind', 3, t('fxInd', {n: ind}));
  const ones = [...won.entries()].filter(([k, n]) => n === 1 && real(k)).length; if(ones >= 3) add('one', 3, t('fxOne', {n: ones}));
  // sweeps by region
  if(E.regions.length){
    const per = E.regions.map(() => ({n: 0, c: new Map()}));
    seats.forEach((s, i) => { if(s.r < 0 || !top2[i][0]) return; const a = per[s.r]; a.n++; const k = top2[i][0][0]; a.c.set(k, (a.c.get(k) || 0) + 1); });
    const sw = per.map((a, r) => ({r, n: a.n, top: [...a.c.entries()].sort((x, y) => y[1] - x[1])[0]})).filter(o => o.n >= 4 && o.top && o.top[1] === o.n && real(o.top[0])).sort((a, b) => b.n - a.n)[0];
    if(sw) add('sweep', 7, t('fxSweep', {p: pName(P[sw.top[0]]), n: sw.n, r: stName(E.regions[sw.r])}));
  }
  // reserved seats
  ['SC', 'ST'].forEach(c => { const idx = seats.map((s, i) => i).filter(i => seats[i].cat === c); if(idx.length >= 10){ const cnt = new Map(); idx.forEach(i => { const k = top2[i][0] && top2[i][0][0]; if(k != null) cnt.set(k, (cnt.get(k) || 0) + 1); });
    const best = [...cnt.entries()].sort((a, b) => b[1] - a[1])[0]; if(best) add('res' + c, 4, t('fxRes', {n: idx.length, c, p: pName(P[best[0]]), m: best[1]})); } });
  // women (only where most seats have a recorded sex)
  if(E.names){ let known = 0, w = 0; E.names.forEach(r => { if(r && r[2]){ known++; if(r[2] === 'F') w++; } }); if(known > 0.7 * N && w) add('women', 8, t('fxWomen', {n: w, x: fmt1(100 * w / known)})); }
  // versus the previous election
  try{
    const list = await history(), idx = list.findIndex(x => x.id === ent.id);
    if(idx > 0){ const pv = list[idx - 1], cnt = {}, vs = {}; let pt = 0;
      pv.seats.forEach(s => { if(s[4].length){ const p = pv.parties[s[4][0]]; cnt[p] = (cnt[p] || 0) + (s[6] || 1); } for(let k = 0; k < s[4].length; k += 2){ const p = pv.parties[s[4][k]]; vs[p] = (vs[p] || 0) + s[4][k + 1]; pt += s[4][k + 1]; } pt += s[5] || 0; });
      const diffs = stat.map(o => { const c = P[o.k]; return {c, dv: o.v - 100 * (vs[c] || 0) / pt, ds: o.n - (cnt[c] || 0), a: cnt[c] || 0, b: o.n}; }).filter(o => vs[o.c] > 0);
      const g = diffs.slice().sort((a, b) => b.dv - a.dv)[0], l = diffs.slice().sort((a, b) => a.dv - b.dv)[0], sg = diffs.slice().sort((a, b) => b.ds - a.ds)[0];
      if(g && g.dv > 1.5) add('gain', 8, t('fxGain', {p: pName(g.c), y: pv.label, x: fmt1(g.dv)}));
      if(l && l.dv < -1.5) add('loss', 7, t('fxLoss', {p: pName(l.c), y: pv.label, x: fmt1(l.dv)}));
      if(sg && sg.ds >= 3) add('sgain', 8, t('fxSeatGain', {p: pName(sg.c), y: pv.label, a: sg.a, b: sg.b}));
    }
  }catch(err){ console.error(err); }
  return F.sort((a, b) => b.w - a.w);
}
registerTool({id: 'facts', label: 'toolFacts', sub: 'factsSub', async render(body, stale){

// ---- shared ----
const SKIP_P = new Set(['IND', 'OTH', 'NOTA']);
function ranked(e, s){ const f = s[4], out = []; for(let k = 0; k < f.length; k += 2) out.push([e.parties[f[k]], f[k+1]]); out.sort((a, b) => b[1] - a[1]); return out; }
const pcell = code => `<span class="pname"><i class="sw" style="background:${pColor(code)}"></i><span>${esc(pName(code))}</span></span>`;
function seatLabelOf(e, s){ return esc(s[1]) + (e.kind === 'LS' && s[3] >= 0 ? ` <span class="small">${esc(stName(e.regions[s[3]] || ''))}</span>` : ''); }
const histCache = {};
async function history(){ const f = entry().file; if(!histCache[f]) histCache[f] = await histList(); return histCache[f]; }
function nationalLeader(e){ const c = {}; e.seats.forEach(s => { if(s[4].length){ const p = e.parties[s[4][0]]; c[p] = (c[p] || 0) + (s[6] || 1); } }); return Object.entries(c).sort((a, b) => b[1] - a[1])[0][0]; }

// ---------- Closest contests (#13) ----------
registerTool({id: 'closest', label: 'clTitle', sub: 'clSub', async render(body, stale){
  const ent = entry(), list = await history(); if(stale()) return;
  const scope = S.clScope || 'this', thr = +(S.clThr || 1000);
  const rows = [];
  (scope === 'all' ? list : list.filter(e => e.id === ent.id)).forEach(e => e.seats.forEach(s => {
    const r = ranked(e, s); if(r.length < 2) return; const m = r[0][1] - r[1][1], tot = seatTotal(s);
    if(m < thr) rows.push({e, s, w: r[0][0], u: r[1][0], m, pct: tot ? 100 * m / tot : 0}); }));
  rows.sort((a, b) => a.m - b.m || a.e.year - b.e.year);
  body.innerHTML = `<div class="tools-row"><label>${esc(t('clScope'))} <select id="clScope"><option value="this" ${scope==='this'?'selected':''}>${esc(t('clThis'))}</option><option value="all" ${scope==='all'?'selected':''}>${esc(t('clAll'))}</option></select></label>
    <label>${esc(t('clUnder'))} <select id="clThr">${[100, 500, 1000, 2000, 5000].map(n => `<option value="${n}" ${n===thr?'selected':''}>${esc(t('clVotes', {n: fmtN(n)}))}</option>`).join('')}</select></label>
    <span class="pill">${esc(t('clCount', {n: rows.length}))}</span></div>
    ${scope === 'this' && (ent.approx || ent.partial) ? `<p class="small" style="color:var(--warn)">${esc(t('clApprox'))}</p>` : ''}
    ${rows.length ? `<div class="seatlist" style="max-height:440px"><table class="tbl"><thead><tr><th>${esc(t('thYear'))}</th><th>${esc(t('thSeatN'))}</th><th>${esc(t('thWon'))}</th><th>${esc(t('thRun'))}</th><th>${esc(t('thMargin'))}</th><th>${esc(t('thMarginPct'))}</th></tr></thead><tbody>
    ${rows.slice(0, 300).map(o => `<tr><td>${esc(o.e.label)}</td><td>${seatLabelOf(o.e, o.s)}</td><td>${pcell(o.w)}</td><td>${pcell(o.u)}</td><td class="num"><b>${fmtN(o.m)}</b></td><td class="num">${fmt1(o.pct)}</td></tr>`).join('')}</tbody></table></div>` : `<p class="small">${esc(t('clNone', {n: fmtN(thr)}))}</p>`}`;
  $('#clScope').onchange = e => { S.clScope = e.target.value; toolKeyShown = null; toolsTouch(true); };
  $('#clThr').onchange = e => { S.clThr = e.target.value; toolKeyShown = null; toolsTouch(true); };
}});

// ---------- Seat records (#12) ----------
const recCache = {};
function buildRecords(list){
  const seats = new Map(), lead = list.map(nationalLeader);
  list.forEach((e, ei) => e.seats.forEach(s => {
    if(!s[4].length || seatTotal(s) <= 0) return;
    const r = ranked(e, s), tot = seatTotal(s), key = (e.kind === 'LS' && s[3] >= 0 ? (e.regions[s[3]] || '') + '|' : '') + nameKey(s[1]);
    let a = seats.get(key); if(!a){ a = {name: s[1], region: e.kind === 'LS' && s[3] >= 0 ? e.regions[s[3]] : '', hist: []}; seats.set(key, a); }
    a.name = s[1]; a.hist.push({y: e.label, ei, p: r[0][0], m: r.length > 1 ? r[0][1] - r[1][1] : r[0][1], pct: 100 * (r.length > 1 ? r[0][1] - r[1][1] : r[0][1]) / tot, lead: lead[ei] === r[0][0]});
  }));
  return [...seats.values()];
}
registerTool({id: 'records', label: 'recTitle', sub: 'recSub', async render(body, stale){
  const list = await history(); if(stale()) return;
  const f = entry().file; if(!recCache[f]) recCache[f] = buildRecords(list);
  const all = recCache[f], minN = Math.min(8, Math.max(3, Math.floor(list.length / 2)));
  const lbl = a => `${esc(a.name)}${a.region ? ` <span class="small">${esc(stName(a.region))}</span>` : ''}`;
  const tab = (title, sub, head, rows) => `<div><h4>${esc(title)}</h4>${sub ? `<p class="small" style="margin:0 0 4px">${esc(sub)}</p>` : ''}<div class="seatlist" style="max-height:330px"><table class="tbl"><thead><tr>${head.map(h => `<th>${esc(h)}</th>`).join('')}</tr></thead><tbody>${rows.join('')}</tbody></table></div></div>`;
  const bell = all.filter(a => a.hist.length >= minN).map(a => ({a, hit: a.hist.filter(h => h.lead).length, n: a.hist.length})).sort((x, y) => y.hit / y.n - x.hit / x.n || y.n - x.n).slice(0, 10);
  const streaks = all.map(a => { let best = {n: 0}, cur = {n: 0}; a.hist.forEach((h, i) => { if(i && a.hist[i-1].p === h.p) cur = {n: cur.n + 1, p: h.p, from: cur.from, to: h.y}; else cur = {n: 1, p: h.p, from: h.y, to: h.y}; if(cur.n > best.n) best = Object.assign({}, cur); }); return {a, best}; }).sort((x, y) => y.best.n - x.best.n).slice(0, 10);
  const safe = all.filter(a => a.hist.length >= minN).map(a => ({a, avg: a.hist.reduce((s, h) => s + h.pct, 0) / a.hist.length})).sort((x, y) => y.avg - x.avg).slice(0, 10);
  const flat = all.flatMap(a => a.hist.map(h => ({a, h})));
  const closeR = flat.slice().sort((x, y) => x.h.m - y.h.m).slice(0, 10), bigR = flat.slice().sort((x, y) => y.h.m - x.h.m).slice(0, 10);
  const flips = all.map(a => ({a, n: a.hist.reduce((c, h, i) => c + (i && a.hist[i-1].p !== h.p ? 1 : 0), 0), tot: a.hist.length})).sort((x, y) => y.n - x.n || y.tot - x.tot).slice(0, 10);
  body.innerHTML = `<div class="tools-cols">
    ${tab(t('recBell'), t('recBellSub'), [t('thSeatN'), t('thTimes')], bell.map(o => `<tr><td>${lbl(o.a)}</td><td class="num"><b>${esc(t('recOf', {a: o.hit, b: o.n}))}</b></td></tr>`))}
    ${tab(t('recStreak'), '', [t('thSeatN'), t('thParty2'), t('thStreak')], streaks.map(o => `<tr><td>${lbl(o.a)}</td><td>${pcell(o.best.p)}</td><td class="num"><b>${o.best.n}</b><div class="small">${esc(t('recYears', {a: o.best.from, b: o.best.to}))}</div></td></tr>`))}
    ${tab(t('recSafe'), t('recSafeSub'), [t('thSeatN'), t('thParty2'), t('thMarginPct')], safe.map(o => `<tr><td>${lbl(o.a)}</td><td>${pcell(o.a.hist[o.a.hist.length - 1].p)}</td><td class="num"><b>${fmt1(o.avg)}</b></td></tr>`))}
    ${tab(t('recFlip'), '', [t('thSeatN'), t('thTimes')], flips.map(o => `<tr><td>${lbl(o.a)}</td><td class="num"><b>${esc(t('recOf', {a: o.n, b: o.tot - 1}))}</b></td></tr>`))}
    ${tab(t('recClose'), '', [t('thYear'), t('thSeatN'), t('thParty2'), t('thMargin')], closeR.map(o => `<tr><td>${esc(o.h.y)}</td><td>${lbl(o.a)}</td><td>${pcell(o.h.p)}</td><td class="num"><b>${fmtN(o.h.m)}</b></td></tr>`))}
    ${tab(t('recBig'), '', [t('thYear'), t('thSeatN'), t('thParty2'), t('thMargin')], bigR.map(o => `<tr><td>${esc(o.h.y)}</td><td>${lbl(o.a)}</td><td>${pcell(o.h.p)}</td><td class="num"><b>${fmtN(o.h.m)}</b></td></tr>`))}
  </div>`;
}});

// ---------- Strike rate (#52) ----------
registerTool({id: 'strike', label: 'srTitle', sub: 'srSub', live: true, key: simKey, render(body){
  const ent = entry(), N = E.seats.length;
  const rows = U.map((g, ui) => ({g, ui})).filter(o => o.g.key !== 'OTH').map(o => {
    let c = 0, vs = 0; E.seats.forEach(s => { if(s.tot > 0 && o.g.members.some(k => E.parties[k] !== 'IND' && s.v[k] > 0)){ c++; vs += s.base[o.ui]; } });
    return {g: o.g, c, won: o.g.baseSeats, sim: RES.counts[o.ui], avg: c ? 100 * vs / c : 0};
  }).filter(r => r.c > 0).sort((a, b) => b.won - a.won || b.c - a.c).slice(0, 18);
  const bar = (w, col) => `<div class="meter"><i style="width:${Math.min(100, w)}%;background:${col}"></i></div>`;
  body.innerHTML = `<div class="seatlist" style="max-height:480px"><table class="tbl"><thead><tr><th>${esc(S.mode === 'alliance' ? t('thAlly') : t('thParty'))}</th><th>${esc(t('thContested'))}</th><th>${esc(t('srActual'))}</th><th>${esc(t('thStrike'))}</th><th>${esc(t('srSim'))}</th><th>${esc(t('srSimRate'))}</th><th>${esc(t('thAvgShare'))}</th></tr></thead><tbody>
    ${rows.map(r => { const a = 100 * r.won / r.c, s = 100 * r.sim / r.c; return `<tr><td><span class="pname"><i class="sw" style="background:${r.g.hex}"></i><span>${esc(r.g.name)}</span></span></td><td class="num">${r.c}</td><td class="num">${r.won}</td><td class="num"><b>${fmt1(a)}%</b>${bar(a, r.g.hex)}</td><td class="num">${r.sim}${r.sim !== r.won ? ` <small class="${r.sim > r.won ? 'up' : 'down'}">${r.sim > r.won ? '+' : ''}${r.sim - r.won}</small>` : ''}</td><td class="num"><b>${fmt1(s)}%</b>${bar(s, r.g.hex)}</td><td class="num">${fmt1(r.avg)}%</td></tr>`; }).join('')}</tbody></table></div>
    <p class="small" style="margin:6px 0 0">${esc(t('srNote'))}</p>`;
  $('#toolSub').textContent = t('srSub', {y: ent.label});
}});

// ---------- Head-to-head (#53) ----------
registerTool({id: 'h2h', label: 'h2hTitle', sub: 'h2hSub', async render(body, stale){
  const list = await history(); if(stale()) return;
  const wins = {}; list.forEach(e => e.seats.forEach(s => { if(s[4].length){ const p = e.parties[s[4][0]]; if(!SKIP_P.has(p)) wins[p] = (wins[p] || 0) + (s[6] || 1); } }));
  const opts = Object.entries(wins).sort((a, b) => b[1] - a[1]).slice(0, 14).map(x => x[0]);
  if(opts.length < 2){ body.innerHTML = `<p class="small">${esc(t('toolsNoData'))}</p>`; return; }
  let A = S.h2hA, B = S.h2hB; if(!opts.includes(A)) A = opts[0]; if(!opts.includes(B) || B === A) B = opts.find(x => x !== A);
  S.h2hA = A; S.h2hB = B;
  const fights = (e) => { let n = 0, a = 0, b = 0, byR = new Map();
    e.seats.forEach(s => { const r = ranked(e, s); if(r.length < 2) return; const x = r[0][0], y = r[1][0]; if((x === A && y === B) || (x === B && y === A)){ n++; (x === A ? a++ : b++);
      if(s[3] >= 0){ const g = byR.get(s[3]) || {n: 0, a: 0, b: 0}; g.n++; x === A ? g.a++ : g.b++; byR.set(s[3], g); } } });
    return {n, a, b, byR}; };
  const per = list.map(e => ({e, f: fights(e)})).filter(o => o.f.n > 0);
  const cur = fights(E.raw), isLS = S.kind === 'LS';
  const sel = (id, v) => `<select id="${id}">${opts.map(p => `<option value="${esc(p)}" ${p === v ? 'selected' : ''}>${esc(pName(p))}</option>`).join('')}</select>`;
  const stack = (f) => `<div class="bar" style="min-width:90px"><i style="width:${100 * f.a / f.n}%;background:${pColor(A)}"></i><i style="width:${100 * f.b / f.n}%;background:${pColor(B)}"></i></div>`;

function fitSeats(ui, want){
  const save = Object.assign({}, S.T), seatsAt = v => { S.T = Object.assign({}, save); setTarget(ui, v); return winners(simulate(targets()), S.overrides).counts[ui]; };
  const T0 = targets(), lockedSum = U.reduce((a, g, j) => a + (j !== ui && S.locks[g.key] ? T0[j] : 0), 0);
  let lo = 0, hi = Math.max(0, 100 - lockedSum - 0.5);
  if(want >= seatsAt(hi)){ S.T = save; setTarget(ui, hi); return; }
  if(want <= 0){ S.T = save; setTarget(ui, 0); return; }
  for(let it = 0; it < 22; it++){ const mid = (lo + hi) / 2; if(seatsAt(mid) >= want) hi = mid; else lo = mid; }
  S.T = save; setTarget(ui, Math.round(hi * 10) / 10);
}
async function applyPoll(set, poll){
  const base = INDEX.elections.find(e => e.id === set.base); if(!base) return;
  track('poll_preset', {set: set.id, by: poll.by});
  S.tab = 'easy'; S.mode = set.mode;
  await openSim(base.kind, base.state, set.base);
  if(S.mode !== set.mode){ S.mode = set.mode; }
  S.T = {}; S.locks = {}; S.overrides = {}; S.regional = {}; S.swing = {a: null, b: null, pts: 0}; rebuild();
  const order = Object.keys(set.units).sort((a, b) => poll.seats[b] - poll.seats[a]);
  const targetsList = order.map(l => ({l, ui: U.findIndex(g => g.key === (set.mode === 'alliance' ? 'A:' + set.units[l] : set.units[l])), want: poll.seats[l]})).filter(o => o.ui >= 0);
  for(let pass = 0; pass < 12; pass++){
    targetsList.forEach(o => { S.locks = {}; targetsList.forEach(p => { if(p !== o) S.locks[U[p.ui].key] = true; }); fitSeats(o.ui, o.want); });
    if(targetsList.every(o => Math.abs(winners(simulate(targets()), S.overrides).counts[o.ui] - o.want) <= 1)) break;
  }
  S.locks = {};
  S.pollScn = {set, poll, sig: pollSig()};
  run(); renderPane();
}
const pollSig = () => JSON.stringify(Object.entries(S.T).map(([k, v]) => [k, Math.round(v * 10) / 10]));

}

  ['First past the post', 'पहले नंबर पर जीत (फ़र्स्ट पास्ट द पोस्ट)', 'The candidate with the most votes in a constituency wins, even without a majority of the votes. India uses this for the Lok Sabha and state assemblies, which is why a party\'s share of seats can differ a lot from its share of votes.', 'चुनाव क्षेत्र में सबसे ज़्यादा वोट पाने वाला उम्मीदवार जीतता है, भले ही उसे आधे से कम वोट मिले हों। भारत में लोकसभा और विधानसभाओं में यही व्यवस्था है, इसीलिए किसी दल का सीट-हिस्सा उसके वोट-हिस्से से काफ़ी अलग हो सकता है।'],
  ['Vote share', 'वोट हिस्सा', 'The percentage of all votes polled that a party or candidate received.', 'डाले गए कुल वोटों में से किसी दल या उम्मीदवार को मिले वोटों का प्रतिशत।'],
  ['Seat share', 'सीट हिस्सा', 'The percentage of all seats a party won. Compare it with vote share to see how well a party turns votes into seats.', 'किसी दल की जीती हुई सीटों का कुल सीटों में प्रतिशत। इसे वोट हिस्से से मिलाकर देखें कि दल वोट को सीट में कितना बदल पाता है।'],
  ['Swing', 'स्विंग', 'The change in a party\'s vote share between two elections, in percentage points.', 'दो चुनावों के बीच किसी दल के वोट हिस्से में हुआ बदलाव, प्रतिशत अंकों में।'],
  ['Uniform swing', 'एकसमान स्विंग', 'Every constituency gets the same change in percentage points.', 'हर चुनाव क्षेत्र पर प्रतिशत अंकों में एक जैसा बदलाव लगता है।'],
  ['Proportional swing', 'अनुपातिक स्विंग', 'Every party\'s share is multiplied by the same factor, so strong areas move more than weak ones.', 'हर दल का हिस्सा एक ही गुणक से बढ़ता या घटता है, इसलिए मज़बूत इलाक़े ज़्यादा खिसकते हैं।'],
  ['Majority mark', 'बहुमत का आँकड़ा', 'More than half the seats: 272 of 543 in the Lok Sabha, and half plus one in an assembly.', 'आधे से ज़्यादा सीटें: लोकसभा में 543 में से 272, और विधानसभा में आधा और एक।'],
  ['Hung house', 'त्रिशंकु सदन', 'A result where no party or alliance has a majority on its own.', 'ऐसा नतीजा जिसमें किसी दल या गठबंधन के पास अपने दम पर बहुमत न हो।'],
  ['Alliance (coalition)', 'गठबंधन', 'Parties that contest together or govern together, such as the NDA or the INDIA bloc.', 'वे दल जो साथ चुनाव लड़ते या साथ सरकार चलाते हैं, जैसे एनडीए या इंडिया गठबंधन।'],
  ['Vote transfer', 'वोट ट्रांसफ़र', 'How much of one ally\'s vote moves to its partner in a seat where the partner stands. It is never a full 100% in real life.', 'जिस सीट पर साझेदार लड़ रहा हो वहाँ एक सहयोगी का कितना वोट उसके साझेदार को जाता है। असल में यह कभी पूरा 100% नहीं होता।'],
  ['Reserved seat (SC / ST)', 'आरक्षित सीट (अनुसूचित जाति / जनजाति)', 'A constituency where only candidates from Scheduled Castes or Scheduled Tribes can stand. Every voter in it still votes.', 'ऐसा चुनाव क्षेत्र जहाँ सिर्फ़ अनुसूचित जाति या जनजाति के उम्मीदवार खड़े हो सकते हैं। उसके सभी मतदाता फिर भी वोट देते हैं।'],
  ['NOTA', 'नोटा', 'None of the above. A button on the voting machine to reject all candidates. It does not change who wins.', 'इनमें से कोई नहीं। सभी उम्मीदवारों को नकारने का बटन। इससे यह तय नहीं होता कि कौन जीतेगा।'],
  ['Delimitation', 'परिसीमन', 'Redrawing constituency boundaries, and the number of seats per state, after a census. The latest one used in Janadesh maps is from 2008.', 'जनगणना के बाद चुनाव क्षेत्रों की सीमाएँ और हर राज्य की सीटें फिर से तय करना। जनादेश के नक्शों में 2008 वाला परिसीमन है।'],
  ['Anti-defection law', 'दल-बदल विरोधी क़ानून', 'The Tenth Schedule of the Constitution: a member who leaves their party or defies its whip can lose their seat.', 'संविधान की दसवीं अनुसूची: जो सदस्य अपनी पार्टी छोड़े या व्हिप न माने, उसकी सदस्यता जा सकती है।'],
  ['Anti-incumbency', 'सत्ता-विरोधी लहर', 'Voters\' tendency to vote against the party that has been in power.', 'सत्ताधारी दल के ख़िलाफ़ वोट देने का मतदाताओं का रुझान।'],
  ['Incumbent', 'मौजूदा सदस्य / सत्तारूढ़', 'The sitting member of a seat, or the party in government.', 'किसी सीट का वर्तमान सदस्य, या सत्ता में बैठी पार्टी।'],
  ['Margin', 'जीत का अंतर', 'The difference in votes between the winner and the runner-up.', 'विजेता और उपविजेता के वोटों का अंतर।'],
  ['Strike rate', 'स्ट्राइक रेट', 'Seats won divided by seats contested. It matters in seat-sharing talks between allies.', 'जीती गई सीटें भाग लड़ी गई सीटें। सहयोगियों के बीच सीट-बँटवारे की बातचीत में यह अहम होता है।'],
  ['Deposit', 'ज़मानत राशि', 'Money a candidate pays to stand. It is lost if the candidate gets less than one sixth of the valid votes in the seat.', 'चुनाव लड़ने के लिए उम्मीदवार जो रकम जमा करता है। अगर उसे सीट के वैध वोटों का छठा हिस्सा भी न मिले तो रकम ज़ब्त हो जाती है।'],
  ['Bellwether seat', 'बेलवेदर सीट', 'A seat that tends to vote for the party that goes on to win the election overall.', 'ऐसी सीट जो अक्सर उसी दल को चुनती है जो पूरा चुनाव जीतता है।'],
  ['By-election', 'उप-चुनाव', 'An election held for a single seat that has fallen vacant between general elections.', 'आम चुनावों के बीच किसी एक ख़ाली हुई सीट के लिए होने वाला चुनाव।'],
  ['Exit poll', 'एग्ज़िट पोल', 'A survey of voters as they leave the polling booth, published after voting ends. It is different from an opinion poll, which is taken before the vote.', 'मतदान केंद्र से निकलते मतदाताओं का सर्वे, जो मतदान ख़त्म होने के बाद छपता है। ओपिनियन पोल से अलग, जो वोटिंग से पहले होता है।'],
  ['Opinion poll', 'ओपिनियन पोल', 'A survey of voters\' intentions taken before the election.', 'चुनाव से पहले मतदाताओं की मंशा का सर्वे।'],
  ['Lok Sabha', 'लोकसभा', 'The lower house of Parliament, with 543 elected seats.', 'संसद का निचला सदन, जिसमें 543 निर्वाचित सीटें हैं।'],
  ['Vidhan Sabha', 'विधानसभा', 'The legislative assembly of a state or union territory.', 'किसी राज्य या केंद्रशासित प्रदेश की विधायिका।'],
  ['Rajya Sabha', 'राज्यसभा', 'The upper house of Parliament, elected by state assembly members rather than directly by voters.', 'संसद का ऊपरी सदन, जिसे मतदाता सीधे नहीं बल्कि राज्यों के विधायक चुनते हैं।'],
  ['Two-member constituency', 'दो-सदस्यीय चुनाव क्षेत्र', 'A seat that sent two members, used in the first elections to give representation to SC and ST communities.', 'ऐसी सीट जिससे दो सदस्य चुने जाते थे, जो शुरुआती चुनावों में अनुसूचित जाति और जनजाति को प्रतिनिधित्व देने के लिए थी।'],
  ['Monte Carlo simulation', 'मोंटे कार्लो सिम्युलेशन', 'Running the same calculation many times with random errors to see the range of likely results.', 'एक ही गणना को यादृच्छिक त्रुटियों के साथ कई बार चलाना ताकि संभावित नतीजों की रेंज दिखे।'],
  ['Split-ticket voting', 'अलग-अलग चुनावों में अलग वोट', 'Voting for different parties in different elections, for example one party for the state and another for the Lok Sabha.', 'अलग-अलग चुनावों में अलग दलों को वोट देना, जैसे राज्य में एक दल और लोकसभा में दूसरा।'],
  ['Model Code of Conduct', 'आदर्श आचार संहिता', 'Rules for parties and governments from the day an election is announced until results.', 'चुनाव की घोषणा से नतीजों तक दलों और सरकारों के लिए नियम।'],
  ['EVM and VVPAT', 'ईवीएम और वीवीपैट', 'The electronic voting machine, and the paper slip machine that lets a voter see their vote.', 'इलेक्ट्रॉनिक वोटिंग मशीन, और काग़ज़ की पर्ची वाली मशीन जिससे मतदाता अपना वोट देख सकता है।'],
];
PAGES.set('glossary', async box => {
  const draw = q => { const n = nameKey(q || ''); return GLOSS.filter(g => !n || nameKey(g[0] + g[1] + g[2] + g[3]).includes(n)).map(g => `<div class="gl"><h4>${esc(L2(g[0], g[1]))}${LANG === 'hi' ? ` <span class="small">${esc(g[0])}</span>` : ''}</h4><p>${esc(L2(g[2], g[3]))}</p></div>`).join('') || `<p class="small">${esc(t('searchNone'))}</p>`; };
  box.innerHTML = `<article class="page"><h2>${esc(t('glossTitle'))}</h2><p class="lede">${esc(t('glossSub'))}</p><input class="inp" id="glq" type="search" placeholder="${esc(t('glossFind'))}" aria-label="${esc(t('glossFind'))}" style="width:100%;max-width:420px;margin-bottom:12px"><div id="glist">${draw('')}</div></article>`;
  $('#glq').oninput = e => { $('#glist').innerHTML = draw(e.target.value); };
});

function apportion(total, weights, minEach){
  const n = weights.length, sum = weights.reduce((a, b) => a + b, 0), out = new Array(n).fill(0);
  const q = weights.map(w => w / sum * total); let used = 0;
  q.forEach((v, i) => { out[i] = Math.max(minEach, Math.floor(v)); used += out[i]; });
  const rem = q.map((v, i) => ({i, r: v - Math.floor(v)})).sort((a, b) => b.r - a.r);
  for(let k = 0; used < total && k < 10 * n; k++){ out[rem[k % n].i]++; used++; }
  for(let k = n - 1; used > total && k >= 0; k--){ if(out[rem[k % n].i] > minEach){ out[rem[k % n].i]--; used--; } }
  return out;
}

// ---------- history of national swings (from stats.json), shared by the wave tracker and realistic mode ----------
async function swingStats(kind, state){
  const els = INDEX.elections.filter(e => kind === 'LS' ? e.kind === 'LS' : (e.kind === 'AE' && e.state === state)).sort((a, b) => a.year - b.year || a.label.localeCompare(b.label)), st = await statsData(), maxes = [];
  for(let i = 1; i < els.length; i++){ const a = st[els[i - 1].id], b = st[els[i].id]; if(!a || !b) continue; const am = new Map(a.votes); let m = 0; b.votes.forEach(([p, v]) => { if(am.has(p) && (v >= 3 || am.get(p) >= 3)) m = Math.max(m, Math.abs(v - am.get(p))); }); if(m) maxes.push(m); }
  const sorted = maxes.slice().sort((x, y) => x - y);
  return {max: sorted.length ? sorted[sorted.length - 1] : 12, typical: sorted.length ? sorted[Math.floor(sorted.length / 2)] : 5, n: sorted.length};
}
const SWS = new Map(), SWS_WAIT = new Set();
function swingStatsNow(){
  const key = S.kind + '|' + S.state; if(SWS.has(key)) return SWS.get(key);
  if(!SWS_WAIT.has(key)){ SWS_WAIT.add(key); swingStats(S.kind, S.state).then(r => { SWS.set(key, r); if(E && key === S.kind + '|' + S.state){ if(S.real && S.real.on) run(); else realBadge(); } }); }
  return null;
}
function realAllow(hs){
  const w = S.wave || 'none', base = w === 'strong' ? hs.max : w === 'mild' ? (hs.typical * 1.6 + hs.max) / 2 : hs.typical * 1.6, months = S.real && S.real.months != null ? S.real.months : 24;
  return base * (0.35 + 0.65 * Math.min(1, months / 60));
}
function realisticClamp(T){
  if(!S.real || !S.real.on) return T; const hs = swingStatsNow(); if(!hs) return T;
  const allow = realAllow(hs), B = U.map(g => g.base), out = T.slice(); let hit = null;
  U.forEach((g, k) => { if(g.key === 'OTH' || B[k] < 3) return; const d = T[k] - B[k]; if(Math.abs(d) > allow){ out[k] = B[k] + Math.sign(d) * allow; hit = hit || {p: g.name, a: allow}; } });
  if(!hit) return T; const tot = out.reduce((a, b) => a + b, 0); S.realHit = hit; return out.map(v => 100 * v / tot);
}
function realBadge(){
  const el = $('#badges'); if(!el || !RES || !E) return; el.querySelectorAll('.realtag').forEach(x => x.remove());
  const hs = swingStatsNow(); if(!hs) return; const T = RES.T, B = U.map(g => g.base); let worst = null;
  U.forEach((g, k) => { if(g.key === 'OTH' || B[k] < 3) return; const d = Math.abs(T[k] - B[k]); if(!worst || d > worst.d) worst = {d, g}; });
  if(!worst) return; let msg = '';
  if(S.real && S.real.on){ const a = realAllow(hs); if(S.realHit) msg = t('realClamped', {p: S.realHit.p, a: fmt1(a)}); else if(worst.d > a) msg = t('realLimit', {a: fmt1(a), p: worst.g.name, x: fmt1(worst.d)}); }
  if(!msg && worst.d > hs.max + 0.05) msg = t('realBeyond', {p: worst.g.name, x: fmt1(worst.d), m: fmt1(hs.max)});
  if(msg) el.insertAdjacentHTML('beforeend', ` <span class="tag warn realtag" title="${esc(msg)}">⚠ ${esc(msg)}</span>`);
}
// ---------- wave tracker ----------
registerTool({id: 'waves', label: 'toolWave', sub: 'waveSub', async render(body, stale){
  const list = await history(); if(stale()) return;
  if(list.length < 2){ body.innerHTML = `<p class="small">${esc(t('waveNeedPrev'))}</p>`; return; }
  const agg = e => { const v = {}; let tot = 0; e.seats.forEach(s => { const f = s[4]; for(let k = 0; k < f.length; k += 2){ const p = e.parties[f[k]]; v[p] = (v[p] || 0) + f[k + 1]; tot += f[k + 1]; } tot += s[5] || 0; }); return {v, tot}; };
  const seatShare = (e, s, p) => { let v = 0, tot = s[5] || 0; for(let k = 0; k < s[4].length; k += 2){ if(e.parties[s[4][k]] === p) v += s[4][k + 1]; tot += s[4][k + 1]; } return tot > 0 && v > 0 ? v / tot : null; };
  const rows = [];
  for(let i = 1; i < list.length; i++){ const a = list[i - 1], b = list[i], A = agg(a), B = agg(b);
    const gain = Object.keys(B.v).filter(p => !SKIP_P.has(p) && 100 * B.v[p] / B.tot >= 3 && 100 * (A.v[p] || 0) / A.tot >= 1.5).map(p => ({p, d: 100 * B.v[p] / B.tot - 100 * (A.v[p] || 0) / A.tot})).sort((x, y) => y.d - x.d)[0]; if(!gain) continue;
    const prev = new Map(a.seats.map(s => [seatKey(a, s), s])); let up = 0, n = 0;
    b.seats.forEach(s => { const ps = prev.get(seatKey(b, s)); if(!ps) return; const x1 = seatShare(a, ps, gain.p), x2 = seatShare(b, s, gain.p); if(x1 != null && x2 != null){ n++; if(x2 > x1) up++; } });
    const uni = n >= 20 ? up / n : null, score = uni == null ? gain.d : gain.d * uni; rows.push({e: b, p: gain.p, d: gain.d, uni, score, n}); }
  const nameOf = e => S.kind === 'LS' && ['1977', '1984', '2014', '2019'].includes(e.label) ? t('waveName' + e.label) : '';
  const cls = r => r.score >= 8 ? ['waveStrongT', 'var(--bad)'] : r.score >= 4 ? ['waveMildT', 'var(--warn)'] : ['waveNoneT', 'var(--muted)'];
  body.innerHTML = `${barSvg(rows.map(r => ({l: r.e.label, v: Math.max(0, r.score), c: pColor(r.p)})), {color: 'var(--violet)', fmt: v => fmt1(v), label: t('toolWave'), min: 8})}
    <div class="seatlist" style="max-height:380px;margin-top:6px"><table class="tbl"><thead><tr><th>${esc(t('thElection'))}</th><th>${esc(t('waveGainer'))}</th><th>${esc(t('waveScore'))}</th><th></th></tr></thead><tbody>
    ${rows.slice().reverse().map(r => { const c = cls(r); return `<tr><td><b>${esc(r.e.label)}</b></td><td>${pcell(r.p)}<div class="small">+${fmt1(r.d)} ${LANG === 'hi' ? 'अंक' : 'pts'}${r.uni != null ? ' · ' + esc(t('waveUni', {p: Math.round(100 * r.uni)})) : ''}</div></td><td class="num"><b>${fmt1(r.score)}</b></td><td style="color:${c[1]}"><b>${esc(t(c[0]))}</b>${nameOf(r.e) ? `<div class="small" style="color:var(--muted)">${esc(nameOf(r.e))}</div>` : ''}</td></tr>`; }).join('')}</tbody></table></div>`;

async function predScore(p){

      const ally = Object.assign({}, raw.alliances || {}, (baseRaw && baseRaw.alliances) || {}, (p.sc && p.sc.allyEdit) || {}); for(const k in ally) if(!ally[k]) delete ally[k];

      let rest = 0; cnt.forEach(v => rest += v);

}

const lsIds = () => INDEX.elections.filter(e => e.kind === 'LS').map(e => e.id);
const aeIds = () => INDEX.elections.filter(e => e.kind === 'AE' && e.year >= 1967 && !e.approx).map(e => e.id);
const nm = c => pName(c);
function qWinner(Q, ids, kind){

}

  const ch = choices(a, numOpts(a, 1, s.n), x => String(x)); if(!ch) return null;

}

}
function qStateSeats(Q){

  const ch = choices(a, numOpts(a, 1), x => String(x)); if(!ch) return null;

const ORD_EN = ['first', 'second', 'third', 'fourth', 'fifth', 'sixth', 'seventh', 'eighth', 'ninth', 'tenth', 'eleventh', 'twelfth', 'thirteenth', 'fourteenth', 'fifteenth', 'sixteenth', 'seventeenth', 'eighteenth'];

const lsDate = iso => new Date(iso + 'T00:00:00').toLocaleDateString(LANG === 'hi' ? 'hi-IN' : 'en-IN', {day: 'numeric', month: 'long', year: 'numeric'});
const lsDays = tm => (new Date(tm.to) - new Date(tm.from)) / 864e5;

function qDissolved(Q){

  box.querySelectorAll('[data-mlink]').forEach(b => b.onclick = () => copy(galLink(encodeScenario(forLink(saved[+b.dataset.mlink].s))), t('linkCopied')));
  box.querySelectorAll('[data-mdel]').forEach(b => b.onclick = () => { saved.splice(+b.dataset.mdel, 1); store.set('scenarios', saved); routePages('#/gallery'); });
  const sel = $('#glSel'); if(sel){ const fill = () => { const s = saved[+sel.value]; if(s && !$('#glNm').value) $('#glNm').value = s.name; }; sel.onchange = () => { $('#glNm').value = ''; fill(); }; fill();
    $('#glGo').onclick = () => {
      const s = saved[+sel.value], name = $('#glNm').value.trim() || s.name, desc = $('#glDs').value.trim(), url = galLink(encodeScenario(forLink(s.s)));
      const body = `**Title:** ${name}\n**What it asks:** ${desc || '(please describe)'}\n**Election:** ${scnTitle(s)}\n\n**Link:** ${url}\n\n_Sent from ${location.origin}${location.pathname}_`;
      track('gallery_submit', {e: s.s.eid}); window.open(`${REPO}/issues/new?labels=scenario&title=${encodeURIComponent('Scenario: ' + name)}&body=${encodeURIComponent(body)}`, '_blank', 'noopener'); }; }
});
function renderPlayHome(){
  const g = $('#plGrid'); if(!g) return;
  const cards = [['predict', 'prTitle', 'plPredD', 'var(--violet)'], ['live', 'lvTitle', 'plLiveD', 'var(--bad)'], ['guess', 'gsTitle', 'plGuessD', '#0F8B8D'], ['quiz', 'qzTitle', 'plQuizD', '#D4A017'], ['gallery', 'glTitle', 'plGalD', 'var(--evmblue)']];
  g.innerHTML = cards.map(c => `<button class="scn" data-pl="${c[0]}"><i style="background:${c[3]}"></i><span><b>${esc(t(c[1]))}</b><br><span class="small">${esc(t(c[2]))}</span></span></button>`).join('');
  g.querySelectorAll('[data-pl]').forEach(b => b.onclick = () => { location.hash = '#/' + b.dataset.pl; });
}


async function boot(){
  toolsSetup();
  applyLang();
  $('#langBtn').onclick = () => { LANG = LANG === 'hi' ? 'en' : 'hi'; store.set('lang', LANG); applyLang();
    if(INDEX) renderHome();
    if(E){ syncPickers(); rebuild(true); } };
  $('#brand').onclick = showHome; $('#homeBtn').onclick = showHome;
  INDEX = await getJSON('data/index.json'); META = INDEX.parties;
  S.state = 'Uttar Pradesh';
  $('#goLS').onclick = () => { S.tab = 'easy'; S.mode = 'alliance'; openSim('LS', null, 'next:ls-2024'); };
  document.querySelectorAll('[data-scn]').forEach(b => b.onclick = () => runScenario(+b.dataset.scn));
  $('#kLS').onclick = () => choose('LS');
  $('#kAE').onclick = () => choose('AE', S.state || 'Uttar Pradesh');
  $('#selState').onchange = e => choose('AE', e.target.value);
  $('#selYear').onchange = e => choose(S.kind, S.state, e.target.value);
  document.querySelectorAll('.tabs button').forEach(b => b.onclick = () => { S.tab = b.dataset.tab; renderPane(); });
  initShades();
  $('#seatSearch').oninput = drawSeatList;
  $('#hSeats').onclick = () => { S.histMode='seats'; $('#hSeats').setAttribute('aria-pressed',true); $('#hVotes').setAttribute('aria-pressed',false); drawHistory(); };
  $('#hVotes').onclick = () => { S.histMode='votes'; $('#hVotes').setAttribute('aria-pressed',true); $('#hSeats').setAttribute('aria-pressed',false); drawHistory(); };
  $('#curveUnit').onchange = e => { S.curveKey = e.target.value; drawCurve(); };
  await renderHome();
  bootFromHash(); route();
  $('#searchBtn').onclick = () => openSearch();
  $('#hq').onfocus = () => openSearch(); $('#hq').onclick = () => openSearch();
  document.addEventListener('keydown', ev => { if(ev.key === '/' && !/INPUT|TEXTAREA|SELECT/.test(document.activeElement.tagName) && !$('#modalRoot').firstChild){ ev.preventDefault(); openSearch(); } });
}
boot().catch(err => { console.error(err); $('#liveHemi').innerHTML = `<p><b>${esc(t('loadFail'))}</b><br><span class="small">${esc(t('loadFailSub'))}</span></p>`; });
})();
</script>
