<style>
/* Layout: white workspace. Home view: hero (headline + live 2024 chamber), how-it-works, scenarios, state grid. App view: header with pickers; control rail left; right column = result, map, charts, history. One column on phones with a pinned seat bar. */
:root{
  --bg:#FFFFFF; --panel:#FFFFFF; --sunk:#F2F3F5; --tint:#F6F7F8; --ink:#141414; --muted:#5D6068; --line:#E2E3E6;
  --violet:#4A2577; --violet-soft:#EEE8F5; --evm:#E6E8EA; --evm-edge:#C9CDD2; --evmblue:#1F4FA8; --lamp:#E2231A; --warn:#9A5800; --warn-soft:#FFF5E3; --good:#16794A; --bad:#B4372B;
  --display:"Anek Latin","Anek Devanagari","Segoe UI",system-ui,sans-serif; --body:"Hind","Segoe UI",system-ui,sans-serif;
  --r:12px; color-scheme:light;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{background:var(--bg);color:var(--ink)}
body{font-family:var(--body);font-size:15px;line-height:1.5;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0 32px}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--violet);outline-offset:2px}
.num{font-variant-numeric:tabular-nums}
h1,h2,h3{font-family:var(--display);margin:0;text-wrap:balance}
.wrapw{max-width:1440px;margin:0 auto}

.top{display:flex;flex-wrap:wrap;align-items:center;gap:12px 20px;padding-block:16px 14px;border-bottom:1px solid var(--line);margin-bottom:14px}
.brand{display:flex;align-items:center;gap:12px;margin-right:auto;cursor:pointer;background:none;border:0;padding:0;text-align:left}
.mark{width:38px;height:38px;flex:none;display:block}
.brand h1{font-size:27px;font-weight:800;font-stretch:110%;line-height:1}
.brand p{margin:2px 0 0;color:var(--muted);font-size:13px}
.pick{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.seg{display:inline-flex;border:1px solid var(--ink);border-radius:6px;overflow:hidden;flex-wrap:wrap}
.seg button{border:0;background:var(--panel);padding:5px 12px;cursor:pointer;color:var(--ink);font-weight:500}
.seg button + button{border-left:1px solid var(--ink)}
.seg button[aria-pressed="true"]{background:var(--ink);color:#fff}
select,.inp{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:6px 10px;max-width:100%}
.btn{border:1px solid var(--evm-edge);background:var(--panel);border-radius:5px;padding:6px 12px;cursor:pointer;font-weight:500;text-decoration:none;color:var(--ink);display:inline-flex;align-items:center;gap:6px}
.btn:hover{border-color:var(--violet);color:var(--violet)}
.btn.primary{background:var(--evmblue);border-color:var(--evmblue);color:#fff}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn.primary:hover{color:#fff;filter:brightness(1.08)}
.btn.small{padding:3px 10px;font-size:13px}
.btn.big{padding:12px 20px;font-size:17px;border-radius:10px}
.notice{border-left:4px solid var(--warn);padding:2px 0 2px 12px;font-size:13.5px;display:flex;gap:8px;align-items:baseline;margin-bottom:18px;color:var(--muted)}
.notice b{color:var(--warn);white-space:nowrap}

/* home */
.hero{display:grid;grid-template-columns:minmax(0,1.05fr) minmax(0,1fr);gap:28px;align-items:center;padding-block:26px 22px}
@media (max-width:900px){.hero{grid-template-columns:minmax(0,1fr)}}
.hero h2{font-size:clamp(38px,6vw,68px);font-weight:800;font-stretch:112%;line-height:1;letter-spacing:-.01em}
.hero .sub{font-size:18px;color:var(--muted);max-width:52ch;margin:14px 0 22px}
.hero .ctas{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.hero .ctasub{color:var(--muted);font-size:14px;margin-top:10px}
.hsearch{margin-top:22px;max-width:560px}
.hsearch h4{margin:0;font-family:var(--display);font-size:18px}
.hsearch p{margin:2px 0 8px}
.hsearch input{width:100%;cursor:text;font-size:16px;padding:10px 12px}
.future{margin-top:22px;padding:14px;background:var(--evm);border:1px solid var(--evm-edge);border-radius:12px;max-width:560px}
.future h4{margin:0 0 8px;font-family:var(--display);font-size:18px}
.futrow{display:flex;flex-wrap:wrap;gap:10px;align-items:flex-end}
.futrow label{display:flex;flex-direction:column;gap:3px;font-size:12.5px;color:var(--muted);min-width:0}
.futrow select{min-width:120px}
.future .small{margin:8px 0 0}
.live{border-top:3px solid var(--ink);padding:12px 0 0}
.live p{margin:0 0 4px;font-weight:600;font-family:var(--display);font-size:16px}
.live svg{width:100%;height:auto;display:block}
.livelegend{display:flex;flex-wrap:wrap;gap:4px 14px;font-size:13.5px}
.livelegend span{display:inline-flex;align-items:center;gap:6px}
.sec{padding-block:20px;border-top:3px solid var(--ink);margin-top:10px}
.sec > h3{font-size:24px;font-weight:700;margin-bottom:4px}
.sec > .lede{color:var(--muted);margin:0 0 14px}
.steps{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:18px;margin-top:12px}
@media (max-width:760px){.steps{grid-template-columns:minmax(0,1fr)}}
.steps div{display:grid;grid-template-columns:36px minmax(0,1fr);gap:4px 12px}
.steps b{grid-row:1 / 3;font-family:var(--display);font-size:38px;font-weight:800;line-height:1;color:var(--evm-edge)}
.steps h4{margin:4px 0 0;font-family:var(--display);font-size:18px}
.steps p{margin:0;color:var(--muted)}
.scns{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:12px;margin-top:12px}
.scn{border:1px solid var(--evm-edge);border-radius:4px;padding:14px;background:var(--panel);text-align:left;cursor:pointer;font-size:15.5px;font-weight:500;line-height:1.35;display:flex;gap:10px;align-items:flex-start}
.scn:hover{border-color:var(--violet)}
.scn i{width:10px;align-self:stretch;border-radius:5px;flex:none}
.stgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:8px;margin-top:12px}
.stbtn{border:1px solid var(--evm-edge);border-radius:4px;padding:10px 12px;background:var(--panel);text-align:left;cursor:pointer;display:flex;flex-direction:column;gap:2px}
.stbtn:hover{border-color:var(--violet)}
.stbtn b{font-family:var(--display);font-size:16.5px;font-weight:600}
.stbtn span{font-size:12.5px;color:var(--muted)}
.stbtn .bar{height:5px;margin-top:6px}

/* app */
.grid{display:grid;grid-template-columns:minmax(300px,370px) minmax(0,1fr);gap:18px;align-items:start}
.rail{background:var(--evm);border:1px solid var(--evm-edge);border-radius:14px;box-shadow:inset 0 1px 0 #fff;position:sticky;top:calc(env(safe-area-inset-top,0px) + 10px);max-height:calc(100vh - 20px);display:flex;flex-direction:column;min-width:0}
.tabs{display:flex;flex-wrap:wrap;gap:2px;padding:6px 8px 0;border-bottom:1px solid var(--evm-edge)}
.tabs button{border:0;background:transparent;padding:8px 9px;cursor:pointer;color:var(--muted);border-bottom:2px solid transparent;font-weight:500;font-size:14px}
.tabs button[aria-selected="true"]{color:var(--ink);border-bottom:3px solid var(--evmblue);font-weight:600}
.pane{padding:14px;overflow:auto;min-height:0}
.pane h3{font-size:16px;font-weight:700;margin-bottom:4px}
.hint{color:var(--muted);font-size:13px;margin:0 0 10px}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.between{justify-content:space-between}
.stack{display:flex;flex-direction:column;gap:10px}
.sl{display:grid;grid-template-columns:24px minmax(0,1fr) auto 26px;gap:4px 8px;align-items:center;padding:8px 10px;margin-bottom:6px;background:var(--panel);border:1px solid var(--evm-edge);border-radius:4px}
.sn{width:24px;height:24px;border-radius:3px;color:#fff;font-weight:700;font-size:12.5px;display:grid;place-items:center;text-shadow:0 0 2px rgba(0,0,0,.35)}
.lamp{width:10px;height:10px;border-radius:50%;background:#C8CBD0;box-shadow:inset 0 1px 1px rgba(0,0,0,.25);flex:none}
.lamp.on{background:var(--lamp);box-shadow:0 0 0 3px rgba(226,35,26,.18),0 0 8px rgba(226,35,26,.7)}
.sw{display:inline-block;width:12px;height:12px;border-radius:3px;flex:none}
.sl .nm{display:flex;flex-direction:column;min-width:0;line-height:1.25}
.sl .nmt{font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sl .seatc{font-size:12.5px;color:var(--muted)}
.sl .val{display:flex;align-items:center;gap:6px}
.sl .val input{width:66px;text-align:right;padding:2px 6px;border:1px solid var(--line);border-radius:6px;background:var(--sunk)}
.sl .delta{font-size:12px;color:var(--muted);min-width:48px;text-align:right}
.sl input[type=range]{grid-column:2 / 4;width:100%;accent-color:var(--c,var(--violet))}
.lock{border:0;background:transparent;cursor:pointer;color:#A3A6B8;padding:3px;border-radius:5px;display:grid;place-items:center}
.lock[aria-pressed="true"]{color:#fff;background:var(--evmblue)}
.sumline{font-size:13px;color:var(--muted);margin-top:8px}
.swingbox{background:var(--panel);border:1px solid var(--evm-edge);border-radius:4px;padding:12px}
.swingbox .ends{display:grid;grid-template-columns:minmax(0,1fr) auto minmax(0,1fr);gap:8px;align-items:end}
.swingbox label{display:flex;flex-direction:column;gap:3px;font-size:12.5px;color:var(--muted);min-width:0}
.swingbox select{width:100%}
.swingbox input[type=range]{width:100%;margin-top:12px;accent-color:var(--evmblue)}
.swingread{font-family:var(--display);font-size:17px;font-weight:600;text-align:center;margin-top:4px}
.scale{display:flex;justify-content:space-between;font-size:12px;color:var(--muted)}
.presets{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.presets button{text-align:left;justify-content:flex-start;padding:8px 10px;line-height:1.3}
.mini{border-left:4px solid var(--evmblue);background:var(--panel);padding:8px 12px}
.mini .v{font-family:var(--display);font-weight:600;font-size:16px}

.main{display:flex;flex-direction:column;gap:18px;min-width:0}
.card{background:var(--panel);border-top:3px solid var(--ink);padding:14px 0 6px;min-width:0}
.card > h3{font-size:19px;font-weight:700}
.headline{display:flex;flex-wrap:wrap;gap:6px 12px;align-items:center;margin-bottom:4px}
.headline h2{font-size:32px;font-weight:800;font-stretch:108%;line-height:1.05}
.tag{display:inline-block;font-size:13px;color:var(--muted)}
.tag + .tag::before{content:"/";margin:0 8px 0 2px;color:var(--evm-edge)}
.tag.warn{color:var(--warn);font-weight:600}
.verdict{font-family:var(--display);font-size:19px;font-weight:600;margin:4px 0 12px}
.verdict .lead{color:var(--ink);box-shadow:inset 0 -.42em 0 var(--violet-soft)}
.chamber{display:grid;grid-template-columns:minmax(0,1.15fr) minmax(0,1fr);gap:20px;align-items:start}
@media (max-width:1100px){.chamber{grid-template-columns:minmax(0,1fr)}}
.hemi svg{width:100%;height:auto;display:block}
table{border-collapse:collapse;width:100%;font-size:14px}
th,td{padding:6px 6px;text-align:right;border-bottom:1px solid var(--line)}
th{font-weight:600;color:var(--muted);font-size:12.5px}
td:first-child,th:first-child{text-align:left}
.tw{overflow-x:auto}
.pname{display:flex;align-items:center;gap:7px;min-width:0}
.pname span:last-child{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:210px}
.up{color:var(--good)} .down{color:var(--bad)}
.bar{height:7px;border-radius:4px;background:var(--sunk);overflow:hidden;min-width:60px;display:flex}
.bar i{display:block;height:100%}
.charts{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px 22px;margin-top:10px}
@media (max-width:760px){.charts{grid-template-columns:minmax(0,1fr)}}
.charts figure{margin:0;min-width:0;border-top:1px solid var(--line);padding-top:10px}
.charts figure.wide{grid-column:1 / -1}
.charts figcaption{display:flex;justify-content:space-between;gap:8px;align-items:center;flex-wrap:wrap;font-family:var(--display);font-weight:600;font-size:16px;margin-bottom:2px}
.charts .cap2{font-size:12.5px;color:var(--muted);margin:0 0 6px}
.charts svg{width:100%;height:auto;display:block;overflow:visible}
.mapwrap{display:grid;grid-template-columns:minmax(0,1.7fr) minmax(0,1fr);gap:16px}
@media (max-width:1100px){.mapwrap{grid-template-columns:minmax(0,1fr)}}
.map{background:var(--tint);border-radius:10px;padding:8px}
.map svg{width:100%;height:auto;display:block}
.map path.seat{stroke:#fff;stroke-width:.4;cursor:pointer}
.map path.seat:hover,.map path.seat.sel{stroke:var(--ink);stroke-width:1.2}
.map path.st{fill:none;stroke:var(--ink);stroke-opacity:.35;stroke-width:.6;pointer-events:none}
.legend{display:flex;flex-wrap:wrap;gap:6px 12px;font-size:13px;margin-top:8px}
.legend span{display:inline-flex;align-items:center;gap:5px}
.waffle{display:grid;grid-template-columns:repeat(auto-fill,minmax(14px,1fr));gap:3px}
.waffle i{aspect-ratio:1;border-radius:3px;cursor:pointer;max-width:100%}
.waffle i.sel{outline:2px solid var(--ink)}
.seatlist{max-height:440px;overflow:auto;border:1px solid var(--line);border-radius:8px}
.seatlist table td{font-size:13px}
.seatlist thead th{position:sticky;top:0;background:var(--panel)}
.seatlist tr{cursor:pointer}
.seatlist tr:hover td{background:var(--sunk)}
.tip{position:fixed;pointer-events:none;background:var(--ink);color:#fff;padding:6px 9px;border-radius:7px;font-size:13px;z-index:30;max-width:260px;display:none}
.detail .cand{display:grid;grid-template-columns:minmax(0,1fr) 70px 64px;gap:6px;align-items:center;font-size:14px;padding:3px 0}
.chip{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);border-radius:999px;padding:3px 11px;font-size:13px;cursor:pointer;background:var(--panel)}
.chip[aria-pressed="true"]{border-color:var(--violet);background:var(--violet-soft)}
.mc{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:10px}
.mcbox{border:1px solid var(--line);border-radius:10px;padding:10px}
.mcbox b{font-family:var(--display);font-size:24px;display:block}
.small{font-size:13px;color:var(--muted)}
.hist svg{width:100%;height:auto;display:block}
.modal{position:fixed;inset:0;background:rgba(20,18,40,.45);display:grid;place-items:center;z-index:40;padding:16px}
.modal>div{background:var(--panel);border-radius:var(--r);padding:16px;max-width:min(900px,100%);max-height:90vh;overflow:auto;min-width:0}
textarea{width:100%;min-height:90px;border:1px solid var(--line);border-radius:8px;background:var(--sunk);padding:8px;font-size:12.5px}
.footer{margin-top:24px;color:var(--muted);font-size:13px;line-height:1.6;border-top:1px solid var(--line);padding-top:14px}
input[type=color]{width:34px;height:26px;border:1px solid var(--line);border-radius:6px;padding:0;background:none}
.ptab td{padding:4px}
.loading{display:inline-flex;align-items:center;gap:10px;color:var(--muted);font-size:16px}
.loading i{width:14px;height:14px;border-radius:50%;border:2px solid var(--violet-soft);border-top-color:var(--violet);animation:spin .8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
/* story mode */

.chg{margin:8px 0 14px}

.pbox{min-width:46px;padding:4px 6px;border-radius:6px;color:#fff;text-align:center;font-size:11px;line-height:1.25;text-shadow:0 0 2px rgba(0,0,0,.4)}

/* analysis tools */
.mmgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px 12px}

.fact{border:1px solid var(--evm-edge);border-left:5px solid var(--violet);border-radius:8px;padding:12px 14px;background:var(--panel);display:flex;flex-direction:column;justify-content:space-between;gap:10px}

.tbl{width:100%}
.tbl td,.tbl th{padding:5px 6px}
.tbl tr.click{cursor:pointer}
.tbl tr.click:hover td{background:var(--sunk)}
.tools-row{display:flex;flex-wrap:wrap;gap:8px 12px;align-items:center;margin-bottom:8px}
.tools-row label{display:flex;gap:6px;align-items:center;font-size:13px;color:var(--muted)}

.pill{display:inline-block;border-radius:999px;padding:1px 8px;font-size:12px;background:var(--violet-soft);color:var(--violet)}

<div class="sheet-scrim" id="sheetScrim"></div>
<nav class="tabbar" id="tabbar" aria-label="Sections" hidden>
  <button data-pt="result" aria-selected="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M4 18a8 8 0 0 1 16 0"/><circle cx="7.5" cy="14" r="1"/><circle cx="12" cy="10.5" r="1"/><circle cx="16.5" cy="14" r="1"/></svg><span data-i18n="ptResult"></span></button>
  <button data-pt="map" aria-selected="false"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round" aria-hidden="true"><path d="M3 6l6-2 6 2 6-2v14l-6 2-6-2-6 2z"/><path d="M9 4v14M15 6v14"/></svg><span data-i18n="ptMap"></span></button>
  <button data-pt="controls" aria-selected="false"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M4 7h10M18 7h2M4 17h2M10 17h10"/><circle cx="16" cy="7" r="2"/><circle cx="8" cy="17" r="2"/></svg><span data-i18n="ptControls"></span></button>
  <button data-pt="seats" aria-selected="false"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M8 6h12M8 12h12M8 18h12"/><circle cx="4" cy="6" r="1"/><circle cx="4" cy="12" r="1"/><circle cx="4" cy="18" r="1"/></svg><span data-i18n="ptSeats"></span></button>
</nav>
<div id="modalRoot"></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/d3/7.8.5/d3.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/topojson/3.0.2/topojson.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/pako/2.1.0/pako.min.js"></script>
<!--EMBED-->
<script>
(() => {
'use strict';
const $ = s => document.querySelector(s);
const store = {
  get(k, d){ try{ const v = localStorage.getItem('janadesh:'+k); return v ? JSON.parse(v) : d; }catch(e){ return d; } },
  set(k, v){ try{ localStorage.setItem('janadesh:'+k, JSON.stringify(v)); }catch(e){} }
};
const fmt1 = x => (Math.round(x*10)/10).toFixed(1);
const esc = s => String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
/*I18N*/

let INDEX = null, META = {}, BUNDLES = {}, MAPS = {};
const S = {
  kind:'LS', state:null, eid:null, next:false,
  mode:'party', method:'prop', fixNational:true, transfer:100,
  T:{}, locks:{}, regional:{}, reserved:{SC:{}, ST:{}}, overrides:{},
  allyEdit:{}, partyEdit: store.get('partyEdit', {}),
  ahead:0, shade:'win', sel:null, tab:'easy', mc:null, mcSig:{nat:2, reg:2, seat:4, n:1000},
  swing:{a:null, b:null, pts:0}, inputMode:'votes', histMode:'seats',
};
let E = null, U = [], RES = null;

// ---------- data ----------
function fromEmbedded(u){
  const el = document.getElementById('d:'+u); if(!el) return null;
  const bin = atob(el.textContent.trim()); const a = new Uint8Array(bin.length);
  for(let i=0;i<bin.length;i++) a[i] = bin.charCodeAt(i);
  el.remove();
  return JSON.parse(pako.ungzip(a, {to:'string'}));
}
const BASE = 'source/';
async function getJSON(u){ const e = fromEmbedded(u); if(e) return e; const r = await fetch(BASE+u); if(!r.ok) throw new Error(u+' '+r.status); return r.json(); }
async function bundle(file){ if(!BUNDLES[file]) BUNDLES[file] = await getJSON('data/'+file+'.json'); return BUNDLES[file]; }
async function mapFor(name){ if(!MAPS[name]) MAPS[name] = await getJSON('maps/'+name+'.json'); return MAPS[name]; }

function pName(c){ return (S.partyEdit[c] && S.partyEdit[c].n) || (LANG === 'hi' && HI_PARTY[c]) || (META[c] && META[c].n) || c; }
function pColor(c){ return (S.partyEdit[c] && S.partyEdit[c].c) || (META[c] && META[c].c) || '#9aa0aa'; }
function allyColor(name, members){ return members.length ? pColor(members[0]) : '#9aa0aa'; }

/*ENGINE*/
// ---------- rendering ----------
function entry(){ return INDEX.elections.find(x=>x.id===S.eid); }
function nextYear(ent, k){ k = k || S.ahead || 1; return ent.year + 5*k; }
function renderResult(){
  const maj = Math.floor(E.N/2)+1;
  const order = U.map((g,k)=>k).sort((a,b)=>RES.counts[b]-RES.counts[a] || RES.T[b]-RES.T[a]);
  const lead = order[0], ent = entry();
  const yr = S.next ? nextYear(ent) : ent.label;
  $('#title').textContent = S.kind === 'LS' ? t('titleLS', {y:yr}) : t('titleAE', {s:stName(ent.state), y:yr});
  let badges = '';
  if(S.next) badges += `<span class="tag">${esc(t('badgeProj', {y:ent.label}))}${S.ahead>1?', '+esc(t('badgeAhead',{n:S.ahead})):''}</span> `;
  if(ent.approx) badges += `<span class="tag warn" title="${esc(E.raw.note||'')}">${esc(t('badgeRecon'))}</span> `;
  else if(ent.partial) badges += `<span class="tag" title="${esc(t('partialNote'))}">${esc(t('badgePartial'))}</span> `;
  badges += `<span class="tag">${esc(t('badgeSeats', {n:E.N, m:maj}))}</span>`;
  $('#badges').innerHTML = badges;
  const lc = RES.counts[lead], ld = lc - U[lead].baseSeats;
  const chg = ld ? `<span class="small">${esc(t('chg', {d:(ld>0?'+':'')+ld, b:U[lead].baseSeats}))}</span>` : '';
  const pn = `<span class="lead">${esc(U[lead].name)}</span>`;
  $('#verdict').innerHTML = lc >= maj ? t('verdictMaj', {p:pn, n:lc, c:chg}) : t('verdictHung', {p:pn, n:lc, c:chg, s:maj-lc});
  drawHemicycle($('#hemi'), order.map(k=>({n:RES.counts[k], c:U[k].hex})), E.N, maj, lc, t('needed', {n:maj}));
  const rows = order.filter(k => RES.counts[k] > 0 || RES.T[k] >= 0.5 || U[k].baseSeats > 0).map(k => {
    const g = U[k], ds = RES.counts[k] - g.baseSeats, dv = RES.T[k] - g.base;
    const mc = S.mc && S.mc.sig === JSON.stringify(sigOf()) ? S.mc.units[k] : null;
    return `<tr><td><span class="pname"><i class="sw" style="background:${g.hex}"></i><span title="${esc(g.name)}">${esc(g.name)}</span></span></td>
      <td class="num">${fmt1(RES.T[k])}%</td>
      <td class="num"><b>${RES.counts[k]}</b>${mc ? `<div class="small">${mc.lo}–${mc.hi}</div>` : ''}</td>
      <td class="num" style="white-space:nowrap"><span class="small">${g.baseSeats} → ${RES.counts[k]}</span> <b class="${ds>0?'up':ds<0?'down':''}">${ds>0?'+':''}${ds}</b></td>
      <td class="num small">${dv>=0?'+':''}${fmt1(dv)}</td></tr>`;
  }).join('');
  $('#tally').innerHTML = `<thead><tr><th>${esc(S.mode==='alliance'?t('thAlly'):t('thParty'))}</th><th>${esc(t('thVotes'))}</th><th>${esc(t('thSeats'))}</th><th>${esc(t('thChange',{y:ent.label}))}</th><th>${esc(t('thSwing'))}</th></tr></thead><tbody>${rows}</tbody>`;
  const flips = RES.win.reduce((a,w,i)=>a + (w !== E.baseWin[i] ? 1 : 0), 0);
  $('#baseNote').textContent = t('baseNote', {f:flips, n:E.seats.length, y:ent.label}) + ' ' + t(S.method==='prop' ? 'methProp' : 'methUnif');
  renderDock(order, maj);
  if(S.tab === 'votes' && $('#pane .sl')) syncVotes($('#pane'));
  if(S.tab === 'easy' && $('#easyRes')) $('#easyRes').innerHTML = $('#verdict').innerHTML;
  drawCharts(order, maj); drawMap(); drawSeatList(); if(S.sel != null) drawDetail();
  if(S.tab === 'odds') renderPane();
  renderBanner(); toolsTouch();
}
function shortName(g){ if(g.key === 'OTH') return t('others'); if(g.key.startsWith('A:')) return g.name; return LANG==='hi' && HI_PARTY[g.key] && !(S.partyEdit[g.key]&&S.partyEdit[g.key].n) ? HI_PARTY[g.key] : g.key.replace('_SHINDE',''); }

function drawHemicycle(el, groups, N, maj, center, sub){
  const W = 520, H = 290, cx = W/2, cy = H - 18;
  const rows = Math.max(4, Math.round(Math.sqrt(N/3.2)));
  const R1 = 240, R0 = R1 * (N > 300 ? .34 : .40);
  const radii = d3.range(rows).map(r => R0 + (R1-R0)*(rows===1?0:r/(rows-1)));
  const sumR = d3.sum(radii);
  const per = radii.map(r => Math.round(N*r/sumR)); per[rows-1] += N - d3.sum(per);
  const dotR = Math.min(9, (R1-R0)/rows*0.42, Math.PI*R1/per[rows-1]*0.42);
  const pts = [];
  radii.forEach((r, ri) => { const n = per[ri]; for(let j=0;j<n;j++){ const a = Math.PI - (n===1?Math.PI/2:Math.PI*j/(n-1)); pts.push({a, r, x: cx + r*Math.cos(a), y: cy - r*Math.sin(a)}); } });
  pts.sort((p,q)=> q.a - p.a || p.r - q.r);
  const fills = []; groups.forEach(g => { for(let c=0;c<g.n;c++) fills.push(g.c); });
  el.innerHTML = `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Seat chart">
    ${pts.map((p,i)=>`<circle cx="${p.x.toFixed(1)}" cy="${p.y.toFixed(1)}" r="${dotR.toFixed(2)}" fill="${fills[i]||'#ccc'}"/>`).join('')}
    <line x1="${cx}" y1="${cy - R1 - 14}" x2="${cx}" y2="${cy - R0 + 18}" stroke="var(--ink)" stroke-width="1.4" stroke-dasharray="3 3"/>
    <text x="${cx}" y="${cy - 2}" text-anchor="middle" font-family="var(--display)" font-size="40" font-weight="800" fill="var(--ink)">${center}</text>
    <text x="${cx}" y="${cy - 46}" text-anchor="middle" font-size="12.5" fill="var(--muted)">${esc(sub)}</text></svg>`;
}

// ---------- map ----------
let mapCache = {key:null};
const STATE_ALIAS = {ajmer:'rajasthan', bhopal:'madhyapradesh', madhyabharat:'madhyapradesh', vindhyapradesh:'madhyapradesh',
  bilaspur:'himachalpradesh', bombay:'maharashtra', coorg:'karnataka', mysore:'karnataka', hyderabad:'telangana', kutch:'gujarat',
  saurashtra:'gujarat', madras:'tamilnadu', patialaandeastpunjabstatesunion:'punjab', travancorecochin:'kerala', goadamananddiu:'goa',
  dadraandnagarhaveli:'dadraandnagarhavelianddamananddiu', damananddiu:'dadraandnagarhavelianddamananddiu', andamanandnicobarislands:'andamanandnicobar'};
const stKey = n => { const k = String(n).toLowerCase().replace(/&/g,'and').replace(/[^a-z]/g,''); return STATE_ALIAS[k] || k; };
function mapLegend(){
  const ks = U.map((g,k)=>k).filter(k=>RES.counts[k]>0).sort((a,b)=>RES.counts[b]-RES.counts[a]);
  $('#legend').innerHTML = ks.map(k=>`<span><i class="sw" style="background:${U[k].hex}"></i>${esc(U[k].name)} ${RES.counts[k]}</span>`).join('') +
    (S.shade==='mar' ? `<span class="small">${esc(t('legMar'))}</span>` : S.shade==='flip' ? `<span class="small">${esc(t('legFlip'))}</span>` : '');
  if(S.shade === 'share' || S.shade === 'swing' || S.shade === 'new') $('#legend').innerHTML = shadeLegend();
}
async function drawStateMap(el){
  const topo = await mapFor('states');
  const fc = topojson.feature(topo, topo.objects[Object.keys(topo.objects)[0]]);
  const agg = new Map();
  E.seats.forEach((s,i) => { if(s.r < 0) return; const k = stKey(E.regions[s.r]);
    if(!agg.has(k)) agg.set(k, {n:0, c:new Map(), names:new Set()}); const a = agg.get(k);
    a.n += s.m; a.names.add(E.regions[s.r]); a.c.set(RES.win[i], (a.c.get(RES.win[i])||0) + s.m); });
  const W = 600, H = 680, path = d3.geoPath(d3.geoMercator().fitSize([W, H], fc));
  const parts = fc.features.map(f => { const a = agg.get(stKey(f.properties.st));
    if(!a) return `<path d="${path(f)}" fill="var(--sunk)" stroke="#fff" stroke-width=".6"><title>${esc(stName(f.properties.st))}: ${esc(t('noSeatsData'))}</title></path>`;
    const sorted = [...a.c.entries()].sort((x,y)=>y[1]-x[1]), lead = sorted[0];
    const op = S.shade === 'mar' ? Math.max(.3, lead[1]/a.n) : 1;
    return `<path class="seat" data-st="${esc([...a.names][0])}" d="${path(f)}" fill="${U[lead[0]].hex}" fill-opacity="${op}"><title>${esc(stName(f.properties.st))} (${a.n}): ${esc(sorted.map(([u,v]) => `${U[u].name} ${v}`).join(', '))}</title></path>`; }).join('');
  el.innerHTML = `<p class="small" style="margin:0 0 6px">${esc(t('stateMap'))}</p><svg viewBox="0 0 ${W} ${H}" role="img" aria-label="State map">${parts}</svg>`;
  el.querySelectorAll('path[data-st]').forEach(p => p.onclick = () => { $('#seatSearch').value = p.dataset.st; drawSeatList(); });
  mapLegend();
}
async function drawMap(){
  const el = $('#map');
  await shadeData();
  const fillFor = seatFill, opac = seatOpacity;
  const mapName = E.raw.map;
  if(!mapName && S.kind === 'LS'){ try{ await drawStateMap(el); }catch(e){ console.error(e); el.innerHTML = `<p class="small">${esc(t('mapFail'))}</p>`; } return; }
  if(!mapName){
    el.innerHTML = `<p class="small" style="margin:0 0 6px">${esc(t('noMap'))}</p><div class="waffle">${E.seats.map((s,i)=>`<i data-i="${i}" class="${S.sel===i?'sel':''}" style="background:${fillFor(i)};opacity:${opac(i)}" title="${s.no}. ${esc(s.name)}"></i>`).join('')}</div>`;
    el.querySelectorAll('i').forEach(n => n.onclick = () => selectSeat(+n.dataset.i));
    mapLegend(); return;
  }
  const key = S.eid + '|' + mapName;
  if(mapCache.key !== key){ try{
    el.innerHTML = `<span class="loading"><i></i>${esc(t('loadingMap'))}</span>`;
    const topo = await mapFor(mapName);
    const fc = topojson.feature(topo, topo.objects[Object.keys(topo.objects)[0]]);
    const byKey = new Map();
    fc.features.forEach(f => byKey.set(String(f.properties.k != null ? f.properties.k : f.properties.n), f));
    const feats = [];
    E.seats.forEach((s,i) => { const f = byKey.get(String(s.key)); if(f) feats.push({f, i}); });
    const W = 600, H = mapName === 'pc' ? 680 : 520;
    const path = d3.geoPath(d3.geoMercator().fitSize([W, H], {type:'FeatureCollection', features: feats.map(x=>x.f)}));
    let border = '';
    if(mapName === 'pc'){ try{ const st = await mapFor('states'); border = path(topojson.mesh(st, st.objects[Object.keys(st.objects)[0]])); }catch(e){} }
    el.innerHTML = `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Constituency map">${feats.map(x=>`<path class="seat" data-i="${x.i}" d="${path(x.f)}"/>`).join('')}${border?`<path class="st" d="${border}"/>`:''}</svg>`;
    const tip = $('#tip');
    el.querySelectorAll('path.seat').forEach(p => {
      const i = +p.dataset.i;
      p.onclick = () => selectSeat(i);
      p.onmousemove = ev => { const s = E.seats[i], w = RES.win[i], x = RES.shares[i];
        tip.innerHTML = `<b>${esc(s.name)}</b>${s.cat!=='GEN'?' ('+s.cat+')':''}${E.names&&E.names[i]?`<br><span style="opacity:.8">${esc(E.names[i][0])}</span>`:''}<br>${esc(U[w].name)} ${fmt1(100*x[w])}%<br>${esc(t('tipLead', {d:fmt1(100*(x[w]-x[RES.second[i]])), p:U[RES.second[i]].name}))}`;
        tip.style.display='block'; tip.style.left = Math.min(ev.clientX+14, innerWidth-270)+'px'; tip.style.top = (ev.clientY+14)+'px'; };
      p.onmouseleave = () => tip.style.display='none';
    });
    mapCache = {key, missing: E.seats.length - feats.length};
  }catch(e){ console.error(e); el.innerHTML = `<p class="small">${esc(t('mapFail'))}</p>`; return; } }
  el.querySelectorAll('path.seat').forEach(p => { const i = +p.dataset.i; p.style.fill = fillFor(i); p.setAttribute('fill-opacity', opac(i)); p.classList.toggle('sel', S.sel===i); });
  mapLegend();
  if(mapCache.missing > 0) $('#legend').insertAdjacentHTML('beforeend', `<span class="small">${esc(t('notOnMap',{n:mapCache.missing}))}</span>`);
}
function drawSeatList(){
  const q = ($('#seatSearch').value||'').trim().toLowerCase();
  const rows = E.seats.map((s,i)=>({s,i})).filter(o => !q || o.s.name.toLowerCase().includes(q) || (o.s.r>=0 && ((E.regions[o.s.r]||'').toLowerCase().includes(q) || stName(E.regions[o.s.r]||'').includes(q)))).slice(0, 600);
  $('#seatTable').innerHTML = `<thead><tr><th>${esc(t('thSeat'))}</th><th>${esc(t('thWinner'))}</th><th>${esc(t('thLead'))}</th></tr></thead><tbody>${rows.map(({s,i}) => {
    const w = RES.win[i], x = RES.shares[i], flip = w !== E.baseWin[i];
    return `<tr data-i="${i}"><td>${s.no}. ${esc(s.name)}${s.cat!=='GEN'?` <span class="small">${s.cat}</span>`:''}${S.kind==='LS'&&s.r>=0?`<div class="small">${esc(stName(E.regions[s.r]))}</div>`:''}</td>
      <td><span class="pname"><i class="sw" style="background:${U[w].hex}"></i><span>${esc(U[w].name)}</span></span>${flip?`<div class="small">${esc(t('gain'))}</div>`:''}${S.overrides[s.no]!=null?`<div class="small">${esc(t('setByYou'))}</div>`:''}</td>
      <td class="num">${fmt1(100*(x[w]-x[RES.second[i]]))}</td></tr>`; }).join('')}</tbody>`;
  $('#seatTable').querySelectorAll('tr[data-i]').forEach(tr => tr.onclick = () => selectSeat(+tr.dataset.i));
}
function selectSeat(i){ S.sel = i; if(PHONE.matches && document.body.dataset.ptab !== 'map') setPTab('map'); drawDetail(); drawMap(); $('#detail').scrollIntoView({behavior: matchMedia('(prefers-reduced-motion: reduce)').matches ? 'auto':'smooth', block:'nearest'}); }
function drawDetail(){
  const el = $('#detail'), i = S.sel; if(i == null){ el.hidden = true; return; }
  const s = E.seats[i]; el.hidden = false;
  const x = RES.shares[i], ent = entry();
  const ks = [...x.keys()].filter(k => x[k] > 0.003 || s.base[k] > 0.003).sort((a,b)=>x[b]-x[a]);
  const baseParties = [...s.v.keys()].filter(k => s.v[k]>0 && E.parties[k]!=='OTH').sort((a,b)=>s.v[b]-s.v[a]).slice(0,6);
  const mcP = S.mc && S.mc.sig === JSON.stringify(sigOf()) ? S.mc.seatP[i] : null;
  el.innerHTML = `<div class="row between"><h3 style="font-size:20px">${s.no}. ${esc(s.name)} <span class="small">${s.cat}${s.r>=0?', '+esc(stName(E.regions[s.r])):''}${s.m>1?', '+esc(t('twoMember')):''}</span></h3><button class="btn small" id="closeDet">${esc(t('close'))}</button></div>
    <div class="chamber" style="margin-top:10px">
      <div><p class="small" style="margin:0 0 4px">${esc(t('simVote'))}</p>${ks.map(k=>`<div class="cand"><span class="pname"><i class="sw" style="background:${U[k].hex}"></i><span>${esc(U[k].name)}</span></span><div class="bar"><i style="width:${(100*x[k]/x[ks[0]]).toFixed(1)}%;background:${U[k].hex}"></i></div><span class="num" style="text-align:right">${fmt1(100*x[k])}%${mcP?`<div class="small">${esc(t('winPct',{n:Math.round(100*mcP[k])}))}</div>`:''}</span></div>`).join('')}</div>
      <div><p class="small" style="margin:0 0 4px">${esc(t('actual',{y:ent.label}))}${ent.approx?esc(t('reconstructed')):''}</p>${nameLines(i)}${baseParties.map(k=>`<div class="cand"><span class="pname"><i class="sw" style="background:${pColor(E.parties[k])}"></i><span>${esc(pName(E.parties[k]))}</span></span><span class="num small" style="text-align:right">${Math.round(s.v[k]).toLocaleString('en-IN')}</span><span class="num" style="text-align:right">${fmt1(100*s.v[k]/s.tot)}%</span></div>`).join('')}</div>
    </div>
    <p class="small" style="margin:12px 0 6px">${esc(t('setWinner'))}</p>
    <div class="row">${[...U.keys()].filter(k=>U[k].key!=='OTH').slice(0,10).map(k=>`<button class="chip" data-k="${esc(U[k].key)}" aria-pressed="${S.overrides[s.no]===U[k].key}"><i class="sw" style="background:${U[k].hex}"></i>${esc(U[k].name)}</button>`).join('')}<button class="chip" data-k="" aria-pressed="${S.overrides[s.no]==null}">${esc(t('useSwing'))}</button></div><p class="small" style="margin:12px 0 0">${reportLink(i)}</p>`;
  $('#closeDet').onclick = () => { S.sel = null; el.hidden = true; drawMap(); };
  el.querySelectorAll('.chip').forEach(c => c.onclick = () => { if(c.dataset.k) S.overrides[s.no] = c.dataset.k; else delete S.overrides[s.no]; run(); });
}

// ---------- charts ----------
function svgText(x,y,tx,o={}){ return `<text x="${x}" y="${y}" font-size="${o.size||12}" fill="${o.fill||'var(--muted)'}" text-anchor="${o.anchor||'start'}" ${o.weight?`font-weight="${o.weight}"`:''}>${esc(tx)}</text>`; }
function drawCharts(order, maj){
  const ks = order.filter(k => RES.counts[k] > 0 || RES.T[k] >= 1).slice(0, 8);
  { const W = 460, rowH = 30, H = ks.length*rowH + 24, L = 120, R = 70;
    const mx = Math.max(10, ...ks.map(k => Math.max(RES.T[k], 100*RES.counts[k]/E.N)));
    const x = v => L + (W-L-R) * v / mx;
    let g = '';
    ks.forEach((k,i) => { const y = i*rowH + 6, sp = 100*RES.counts[k]/E.N;
      g += svgText(0, y+14, U[k].name.slice(0,17), {fill:'var(--ink)', size:12.5});

function computeTargets(ui, val, T){
  T = T || targets(); val = Math.max(0, Math.min(100, val));
  const locked = U.map((g,k) => k !== ui && S.locks[g.key]);
  const lockedSum = T.reduce((a,x,k)=> a + (locked[k]?x:0), 0);
  val = Math.min(val, 100 - lockedSum);
  const free = U.map((g,k)=>k).filter(k => k !== ui && !locked[k]);
  const freeSum = free.reduce((a,k)=>a+T[k],0), rest = 100 - lockedSum - val;
  T[ui] = val;
  free.forEach(k => T[k] = freeSum > 0 ? T[k]*rest/freeSum : rest/free.length);
  return T;
}
function setTarget(ui, val){ const T = computeTargets(ui, val); U.forEach((g,k)=> S.T[g.key] = T[k]); }
function setAll(T){ const s = T.reduce((a,b)=>a+b,0) || 1; U.forEach((g,k)=> S.T[g.key] = Math.max(0,T[k])*100/s); }
const baseT = () => U.map(g=>g.base);

// Easy tab: one swing slider between two sides + presets
function easyPair(){
  const real = U.map((g,k)=>k).filter(k=>U[k].key!=='OTH').sort((a,b)=>U[b].base-U[a].base);
  let a = U.findIndex(g=>g.key===S.swing.a), b = U.findIndex(g=>g.key===S.swing.b);
  if(a < 0 || U[a].key==='OTH') a = real[0];
  if(b < 0 || b === a || U[b].key==='OTH') b = real.find(k=>k!==a);
  S.swing.a = U[a].key; S.swing.b = U[b].key;
  return [a, b, real];
}
function applySwing(){
  const [a, b] = easyPair(), pts = S.swing.pts, T = baseT();
  const mv = pts >= 0 ? Math.min(pts, T[a]) : -Math.min(-pts, T[b]);
  T[a] -= mv; T[b] += mv; S.T = {}; setAll(T); run();
}

function preset(kind, a, b, inc){
  S.swing.pts = 0;
  let T = baseT();
  if(kind === 'same'){ S.T = {}; S.regional = {}; S.reserved = {SC:{},ST:{}}; S.overrides = {}; run(); renderPane(); return; }
  if(kind === 'repeat'){ repeatSwing(); return; }
  if(kind === 'trend'){ let f = 0; for(let i=0;i<(S.ahead||1);i++) f += Math.pow(0.6, i); repeatSwing(f); return; }
  if(kind === 'waveA') T = computeTargets(a, T[a] + 5, T);
  if(kind === 'waveB') T = computeTargets(b, T[b] + 5, T);
  if(kind === 'close'){ const avg = (T[a]+T[b])/2; T[a] = avg; T[b] = avg; }
  if(kind === 'third'){ const take = Math.min(3, T[a]) + Math.min(3, T[b]); T[a] = Math.max(0,T[a]-3); T[b] = Math.max(0,T[b]-3);
    const rest = U.map((g,k)=>k).filter(k=>k!==a && k!==b), rs = rest.reduce((s,k)=>s+T[k],0) || 1; rest.forEach(k => T[k] += take*T[k]/rs); }
  if(kind === 'anti') T = computeTargets(inc, Math.max(0, T[inc] - 5), T);
  S.T = {}; setAll(T); run(); renderPane();

function solveSeats(k, want){
  const save = Object.assign({}, S.T);
  const seatsAt = v => { S.T = Object.assign({}, save); setTarget(k, v); return winners(simulate(targets()), S.overrides).counts[k]; };
  const T0 = targets(), lockedSum = U.reduce((a,g,j)=> a + (j!==k && S.locks[g.key] ? T0[j] : 0), 0);
  let lo = 0, hi = Math.max(0, 100 - lockedSum - 0.5);
  const maxSeats = seatsAt(hi);
  if(want >= maxSeats){ S.T = save; setTarget(k, hi); run(); renderPane(); toast(want > maxSeats ? t('seatsTop',{p:U[k].name, n:maxSeats, v:fmt1(hi)}) : t('setTo',{v:fmt1(hi)})); return; }
  if(want <= 0){ S.T = save; setTarget(k, 0); run(); renderPane(); return; }
  for(let it=0; it<22; it++){ const mid = (lo+hi)/2; if(seatsAt(mid) >= want) hi = mid; else lo = mid; }
  S.T = save; setTarget(k, Math.round(hi*10)/10); run(); renderPane();
  const got = RES.counts[k], v = fmt1(targets()[k]);
  toast(got === want ? t('seatsGot',{p:U[k].name, n:want, v}) : t('seatsNear',{n:got, v}));
}
async function repeatSwing(factor){
  factor = factor || 1;
  const ent = entry();
  const list = (await bundle(ent.file)).filter(e => e.year < ent.year).sort((a,b)=>b.year-a.year);
  if(!list.length){ toast(t('noEarlier')); return; }
  const prev = list[0];
  const share = e => { const r = {}; let tot = 0; e.seats.forEach(s => { for(let k=0;k<s[4].length;k+=2){ const p = e.parties[s[4][k]]; r[p]=(r[p]||0)+s[4][k+1]; tot+=s[4][k+1]; } tot += s[5]; }); for(const p in r) r[p] = 100*r[p]/tot; return r; };
  const a = share(prev), b = share(E.raw), T = baseT();
  U.forEach((g,k) => { if(g.key==='OTH') return; const d = g.members.map(m=>E.parties[m]).reduce((s,c)=> s + ((b[c]||0) - (a[c]||0)), 0); T[k] = Math.max(0, g.base + d*factor); });
  const oth = U.length-1; T[oth] = Math.max(0, 100 - T.reduce((s,v,k)=> k===oth? s : s+v, 0));
  S.T = {}; setAll(T);
  toast(factor === 1 ? t('repeated',{a:prev.label, b:ent.label}) : t('trendDone',{a:prev.label, b:ent.label, y:nextYear(ent)}));
  run(); renderPane();
}

async function copy(text, msg){
  try{ await navigator.clipboard.writeText(text); toast(msg); }
  catch(e){ modal(`<h3>${esc(t('copyThis'))}</h3><p class="small">${esc(t('copyBlocked'))}</p><textarea style="min-height:200px">${esc(text)}</textarea><div class="row" style="margin-top:8px"><button class="btn" data-close>${esc(t('close'))}</button></div>`); const ta = document.querySelector('.modal textarea'); ta.focus(); ta.select(); }
}
async function applyScenario(s){
  if(!s || !s.eid){ toast(t('badCode')); return; }
  const ent = INDEX.elections.find(e=>e.id===s.eid); if(!ent){ toast(t('noElection')); return; }
  Object.assign(S, {kind:ent.kind, state:ent.state, eid:s.eid, next:!!s.next, ahead:s.ahead||(s.next?1:0), mode:s.mode||'party', method:s.method||'prop', allyEdit:s.allyEdit||{}, transfer:s.transfer||100, fixNational:s.fixNational!==false, lab:s.lab||null});
  if(s.partyEdit){ S.partyEdit = s.partyEdit; store.set('partyEdit', S.partyEdit); }
  showApp(); await load(true);
  Object.assign(S, {T:s.T||{}, locks:s.locks||{}, regional:s.regional||{}, reserved:s.reserved||{SC:{},ST:{}}, overrides:s.overrides||{}, swing:s.swing||{a:null,b:null,pts:0}});
  syncPickers(); renderPane(); run(); toast(t('scnOpened'));
}
const canDownload = !/claude/i.test(location.hostname);
function modal(html){ const r = $('#modalRoot'); r.innerHTML = `<div class="modal" role="dialog" aria-modal="true"><div>${html}</div></div>`; r.querySelectorAll('[data-close]').forEach(b => b.onclick = () => r.innerHTML=''); r.firstChild.onclick = e => { if(e.target === r.firstChild) r.innerHTML=''; }; }
let toastT; function toast(msg){ let el = document.getElementById('toast'); if(!el){ el = document.createElement('div'); el.id='toast'; el.setAttribute('role','status'); el.style.cssText='position:fixed;left:50%;transform:translateX(-50%);bottom:calc(76px + env(safe-area-inset-bottom,0px));background:var(--ink);color:#fff;padding:9px 14px;border-radius:9px;z-index:50;font-size:14px;max-width:90vw'; document.body.appendChild(el); } el.textContent = msg; el.hidden = false; clearTimeout(toastT); toastT = setTimeout(()=>el.hidden=true, 3400); }

// ---------- pickers, loading ----------
function statesList(){ return [...new Set(INDEX.elections.filter(e=>e.kind==='AE').map(e=>e.state))].sort(); }
function electionsFor(){ return INDEX.elections.filter(e => S.kind==='LS' ? e.kind==='LS' : (e.kind==='AE' && e.state===S.state)).sort((a,b)=>b.year-a.year || b.label.localeCompare(a.label)); }
function syncPickers(){
  $('#kLS').setAttribute('aria-pressed', S.kind==='LS'); $('#kAE').setAttribute('aria-pressed', S.kind==='AE');
  const ss = $('#selState'); ss.hidden = S.kind !== 'AE';
  ss.innerHTML = statesList().map(s=>`<option value="${esc(s)}" ${s===S.state?'selected':''}>${esc(stName(s))}</option>`).join('');
  const list = electionsFor(), latest = list[0];
  $('#selYear').innerHTML = `<optgroup label="${esc(t('futGroup'))}">` + [1,2,3,4].map(k=>`<option value="next${k}:${latest.id}" ${S.next&&S.ahead===k?'selected':''}>${esc(t(k===1?'futOpt1':'futOptN',{y:nextYear(latest,k), k}))}</option>`).join('') + `</optgroup><optgroup label="${esc(t('pastGroup'))}">` + list.map(e=>`<option value="${e.id}" ${(!S.next && e.id===S.eid)?'selected':''}>${esc(e.label)}${e.approx?esc(t('reconOpt')):''}</option>`).join('') + '</optgroup>';
}
async function load(keepState){
  E = prepare((await bundle(entry().file)).find(e=>e.id===S.eid));
  if(!keepState){ S.pollScn = null; S.whatIf = null; S.lab = null; S.T = {}; S.locks = {}; S.regional = {}; S.reserved = {SC:{},ST:{}}; S.overrides = {}; S.allyEdit = {}; S.sel = null; S.mc = null; S.swing = {a:null,b:null,pts:0}; }
  mapCache = {key:null}; resetZoom();
  buildUnits(); E.names = null; loadNames();
  $('#detail').hidden = true;
  drawHistory();
}
function rebuild(keepT){
  const old = keepT ? Object.assign({}, S.T) : {};
  buildUnits();
  if(keepT){ S.T = {}; U.forEach(g => { if(old[g.key] != null) S.T[g.key] = old[g.key]; }); const T = targets(), s = T.reduce((a,b)=>a+b,0); U.forEach((g,k)=> S.T[g.key] = T[k]*100/s); }
  S.mc = null; mapCache = {key:null};
  run(); renderPane(); drawHistory();
}
async function choose(kind, state, value){
  S.kind = kind; if(state) S.state = state;
  const list = electionsFor();
  const m = value && value.match(/^next(\d*):(.+)$/);
  if(m){ S.next = true; S.ahead = +m[1] || 1; S.eid = m[2]; }
  else if(value){ S.next = false; S.ahead = 0; S.eid = value; }
  else { S.next = true; S.ahead = 1; S.eid = list[0].id; }
  syncPickers(); await load(false); run(); renderPane();
  store.set('last', {kind:S.kind, state:S.state, eid:S.eid, next:S.next, ahead:S.ahead});
}

// ---------- views ----------
function showHome(){ $('#seatview').hidden = true; $('#pageview').hidden = true; document.title = 'Janadesh'; if(location.hash.startsWith('#/seat/')) history.replaceState(null, '', location.pathname); $('#home').hidden = false; $('#app').hidden = true; $('#appPick').hidden = true; $('#homeBtn').hidden = true; $('#tabbar').hidden = true; closeSheet(); document.body.classList.remove('inapp'); window.scrollTo(0,0); }
function showApp(){ $('#seatview').hidden = true; $('#pageview').hidden = true; $('#home').hidden = true; $('#app').hidden = false; $('#appPick').hidden = false; $('#homeBtn').hidden = false; $('#tabbar').hidden = false; document.body.classList.add('inapp'); setPTab('result'); window.scrollTo(0,0); }
async function openSim(kind, state, value, preferAlly){ showApp(); $('#title').innerHTML = `<span class="loading"><i></i>${esc(t('loading'))}</span>`; await choose(kind, state, value);
  if(preferAlly && S.mode !== 'alliance' && new Set(Object.values(E.raw.alliances||{})).size >= 2){ S.mode = 'alliance'; rebuild(); } }
async function runScenario(n){
  S.tab = 'easy';
  if(n === 1 || n === 2){ S.mode = 'alliance'; await openSim('LS', null, 'next:ls-2024'); S.mode = 'alliance'; rebuild(); S.swing = n===1 ? {a:'A:NDA', b:'A:INDIA', pts:4} : {a:'A:INDIA', b:'A:NDA', pts:4}; applySwing(); renderPane(); }
  if(n === 3){ S.mode = 'party'; const l = INDEX.elections.filter(e=>e.state==='Uttar Pradesh').sort((a,b)=>b.year-a.year)[0]; await openSim('AE', 'Uttar Pradesh', 'next:'+l.id);
    const a = U.findIndex(g=>g.key==='BJP'), b = U.findIndex(g=>g.key==='SP'); if(a>=0 && b>=0){ S.swing = {a:'BJP', b:'SP', pts:0}; preset('close', a, b, a); } }
  if(n === 4){ S.mode = 'party'; const l = INDEX.elections.filter(e=>e.state==='West Bengal').sort((a,b)=>b.year-a.year)[0]; await openSim('AE', 'West Bengal', 'next:'+l.id);
    const a = U.findIndex(g=>g.key==='AITC'); if(a>=0){ S.swing = {a:'AITC', b:'BJP', pts:0}; preset('waveA', a, U.findIndex(g=>g.key==='BJP'), a); } }
}
async function renderHome(){
  // live chamber: 2024 Lok Sabha by alliance
  let c;
  if(INDEX.home) c = new Map(INDEX.home.groups);
  else { const e = (await bundle('ls')).find(x=>x.id==='ls-2024'); c = new Map();
    e.seats.forEach(s => { if(!s[4].length) return; const p = e.parties[s[4][0]], k = e.alliances[p] || p; c.set(k, (c.get(k)||0)+1); }); }
  const groups = [...c.entries()].sort((a,b)=>b[1]-a[1]).map(([k,n]) => ({k, n, c: k==='NDA' ? pColor('BJP') : k==='INDIA' ? pColor('INC') : pColor(k)}));
  const main = groups.filter(g=>g.n>=5), oth = groups.filter(g=>g.n<5).reduce((a,g)=>a+g.n,0);
  const shown = main.concat(oth ? [{k:'OTH', n:oth, c:'#B9BDC4'}] : []);
  drawHemicycle($('#liveHemi'), shown, 543, 272, shown[0].n, t('needed',{n:272}));
  $('#liveLegend').innerHTML = shown.map(g=>`<span><i class="sw" style="background:${g.c}"></i>${esc(g.k==='OTH'?t('others'):(HI_ALLY[g.k]&&LANG==='hi'?HI_ALLY[g.k]:(g.k.length<8&&g.k!=='IND'?g.k:pName(g.k))))} <b class="num">${g.n}</b></span>`).join('');
  // future builder
  const fw = $('#futWhere'), prevW = fw.value || 'LS';
  const lat = new Map(); INDEX.elections.forEach(x => { const key = x.kind==='LS' ? 'LS' : x.state; const l = lat.get(key); if(!l || x.year > l.year) lat.set(key, x); });
  fw.innerHTML = `<option value="LS">${esc(t('lokSabha'))}</option>` + statesList().sort((a,b)=>stName(a).localeCompare(stName(b), LANG==='hi'?'hi':'en')).map(st=>`<option value="${esc(st)}">${esc(stName(st))} ${esc(t('vidhanSabha'))}</option>`).join('');
  fw.value = prevW;
  const fillYears = () => { const l = lat.get(fw.value); $('#futYear').innerHTML = [1,2,3,4].map(k=>`<option value="${k}">${nextYear(l,k)}</option>`).join(''); };
  fillYears(); fw.onchange = fillYears;
  $('#futGo').onclick = () => { const l = lat.get(fw.value), k = +$('#futYear').value; S.tab = 'easy';
    if(l.kind === 'LS'){ S.mode = 'alliance'; openSim('LS', null, `next${k}:${l.id}`); } else { S.mode = 'party'; openSim('AE', l.state, `next${k}:${l.id}`, true); } };
  // states grid
  const latest = new Map(); INDEX.elections.filter(x=>x.kind==='AE').forEach(x => { const l = latest.get(x.state); if(!l || x.year > l.year) latest.set(x.state, x); });
  $('#stgrid').innerHTML = [...latest.values()].sort((a,b)=>stName(a.state).localeCompare(stName(b.state), LANG==='hi'?'hi':'en')).map(x => {
    const tot = x.top.reduce((a,b)=>a+b[1],0) || 1;
    return `<button class="stbtn" data-st="${esc(x.state)}" data-id="${x.id}"><b>${esc(stName(x.state))}</b><span>${esc(t('lastElection',{y:x.label, n:x.seats}))}</span><span class="bar">${x.top.map(([p,n])=>`<i style="width:${100*n/x.seats}%;background:${pColor(p)}"></i>`).join('')}</span></button>`; }).join('');
  renderPollHome(); renderWhatIfHome();
  $('#stgrid').querySelectorAll('.stbtn').forEach(b => b.onclick = () => { S.tab = 'easy'; S.mode = 'party'; openSim('AE', b.dataset.st, 'next:'+b.dataset.id, true); });
}
function applyLang(){
  document.documentElement.lang = LANG === 'hi' ? 'hi' : 'en';
  document.querySelectorAll('[data-i18n]').forEach(el => el.textContent = t(el.dataset.i18n));
  document.querySelectorAll('[data-i18n-ph]').forEach(el => el.placeholder = t(el.dataset.i18nPh));
  $('#langBtn').setAttribute('lang', LANG === 'hi' ? 'en' : 'hi');
  toolsRelabel();
}

/*FEATURES*/
async function boot(){
  toolsSetup();
  applyLang();
  $('#langBtn').onclick = () => { LANG = LANG === 'hi' ? 'en' : 'hi'; store.set('lang', LANG); applyLang();
    if(INDEX) renderHome();
    if(E){ syncPickers(); rebuild(true); } };
  $('#brand').onclick = showHome; $('#homeBtn').onclick = showHome;
  INDEX = await getJSON('data/index.json'); META = INDEX.parties;
  S.state = 'Uttar Pradesh';
  $('#goLS').onclick = () => { S.tab = 'easy'; S.mode = 'alliance'; openSim('LS', null, 'next:ls-2024'); };
  document.querySelectorAll('[data-scn]').forEach(b => b.onclick = () => runScenario(+b.dataset.scn));
  $('#kLS').onclick = () => choose('LS');
  $('#kAE').onclick = () => choose('AE', S.state || 'Uttar Pradesh');
  $('#selState').onchange = e => choose('AE', e.target.value);
  $('#selYear').onchange = e => choose(S.kind, S.state, e.target.value);
  document.querySelectorAll('.tabs button').forEach(b => b.onclick = () => { S.tab = b.dataset.tab; renderPane(); });
  initShades();
  $('#seatSearch').oninput = drawSeatList;
  $('#hSeats').onclick = () => { S.histMode='seats'; $('#hSeats').setAttribute('aria-pressed',true); $('#hVotes').setAttribute('aria-pressed',false); drawHistory(); };
  $('#hVotes').onclick = () => { S.histMode='votes'; $('#hVotes').setAttribute('aria-pressed',true); $('#hSeats').setAttribute('aria-pressed',false); drawHistory(); };
  $('#curveUnit').onchange = e => { S.curveKey = e.target.value; drawCurve(); };
  await renderHome();
  bootFromHash(); route();
  $('#searchBtn').onclick = () => openSearch();
  $('#hq').onfocus = () => openSearch(); $('#hq').onclick = () => openSearch();
  document.addEventListener('keydown', ev => { if(ev.key === '/' && !/INPUT|TEXTAREA|SELECT/.test(document.activeElement.tagName) && !$('#modalRoot').firstChild){ ev.preventDefault(); openSearch(); } });
}
boot().catch(err => { console.error(err); $('#liveHemi').innerHTML = `<p><b>${esc(t('loadFail'))}</b><br><span class="small">${esc(t('loadFailSub'))}</span></p>`; });
})();
</script>
